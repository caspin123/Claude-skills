      - name: Build release APK
        working-directory: AWPlayer_Polished_v46
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK=AWPlayer_Polished_v46/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          if command -v apkanalyzer >/dev/null 2>&1; then
            apkanalyzer manifest application-id "$APK" | grep -qx "com.awystudio.awplayer"
          fi
          cp "$APK" AWPlayer-v4.6-Filters-Resume.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AWPlayer-v4.6-Filters-Resume
          path: AWPlayer-v4.6-Filters-Resume.apk
          if-no-files-found: error