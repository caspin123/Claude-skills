      - name: Show toolchain
        working-directory: AWPlayer_Polished_v461
        run: |
          gradle --version
          grep -n "org.jetbrains.kotlin" build.gradle
          grep -n "play-services-cast-framework" app/build.gradle

      - name: Build release APK
        working-directory: AWPlayer_Polished_v461
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK=AWPlayer_Polished_v461/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          if command -v apkanalyzer >/dev/null 2>&1; then
            apkanalyzer manifest application-id "$APK" | grep -qx 'com.awystudio.awplayer'
          fi
          cp "$APK" AWPlayer-v4.6.1-Filters-Resume-PrivateCast.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AWPlayer-v4.6.1-Filters-Resume-PrivateCast
          path: AWPlayer-v4.6.1-Filters-Resume-PrivateCast.apk
          if-no-files-found: error
