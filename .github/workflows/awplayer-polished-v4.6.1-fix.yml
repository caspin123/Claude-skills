name: Build AW Player v4.6.1 Cast Fix

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - ".github/workflows/awplayer-polished-v4.6.1-fix.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
