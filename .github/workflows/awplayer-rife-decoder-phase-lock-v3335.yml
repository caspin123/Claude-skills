      - name: Fetch RIFE Anime + ncnn
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          chmod +x scripts/prepare_rife.sh
          ./scripts/prepare_rife.sh

      - name: Verify Decoder-Phase Motion Lock payload
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          test -f third_party/rife-ncnn-vulkan/src/rife.cpp
          test -f third_party/rife-ncnn-vulkan/src/warp.cpp
          test -f third_party/rife-ncnn-vulkan/src/ncnn/CMakeLists.txt
          test -f app/src/main/assets/rife-v4.6/flownet.param
          test -f app/src/main/assets/rife-v4.6/flownet.bin
          test -f app/src/main/assets/rife-anime/flownet.param
          test -f app/src/main/assets/rife-anime/flownet.bin
          grep -q 'Vulkan_LIBRARY' app/src/main/cpp/CMakeLists.txt
          grep -q 'NCNN_SIMPLEVK ON' app/src/main/cpp/CMakeLists.txt
          grep -q 'awVkInclude' app/build.gradle
          grep -q 'awVkLibrary' app/build.gradle
          grep -q 'versionCode 3335' app/build.gradle
          grep -q "versionName '3.3.35-rife-decoder-phase-lock'" app/build.gradle
          test -f RIFE_PIXEL_PERFECT_LOCK_BUILD_3334.txt
          test -f FIX_NOTES_v3334.md
          test -f RIFE_DECODER_PHASE_LOCK_BUILD_3335.txt
          test -f FIX_NOTES_v3335.md
          grep -Fq 'lastVisibleTextureTimestampNs' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'videoTextureView?.surfaceTexture?.timestamp' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'sourcePeriodMs.toDouble() * 0.92' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'm.core = raw;' app/src/main/cpp/rife_jni.cpp
          if grep -Fq 'm.core = dilate(raw, 1);' app/src/main/cpp/rife_jni.cpp; then
            echo 'ERROR: old expanded motion mask is still present'
            exit 1
          fi
          grep -Fq 'val earlyToleranceMs = 0L' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'val lateToleranceMs = 2L' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'lockRifeOverlayToTexture' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'overlay.scaleType = ImageView.ScaleType.MATRIX' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'source.getLocationOnScreen(textureLocation)' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'pendingDuplicateSlots' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'totalTargetSteps = sourceIntervalsCovered * 2' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'pairDurationMs !in minAdjacentMs..maxAdjacentMs' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'absolutePtsLooksValid' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'm.feather.assign(raw.size(), 0)' app/src/main/cpp/rife_jni.cpp
          grep -Fq 'alpha = mask.core[mi] ? 255 : 0;' app/src/main/cpp/rife_jni.cpp
          grep -Fq 'if (changedRatio < 0.002)' app/src/main/cpp/rife_jni.cpp
          grep -Fq 'pair_is_scene_cut' app/src/main/cpp/rife_jni.cpp
          grep -Fq 'generated_output_is_suspicious' app/src/main/cpp/rife_jni.cpp
          grep -Fq 'g_rife->process(in0, in1, t, out)' app/src/main/cpp/rife_jni.cpp
          if grep -Fq 'mask.feather[mi] ? 88' app/src/main/cpp/rife_jni.cpp; then
            echo 'ERROR: old semi-transparent background feather is still present'
            exit 1
          fi
          echo '=== RIFE DECODER-PHASE MOTION LOCK PAYLOAD v3335 VERIFIED ==='

      - name: Build release APK
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          gradle :app:assembleRelease --stacktrace --no-daemon \
            -PawVkInclude="$AW_VK_INCLUDE_DIR" \
            -PawVkLibrary="$AW_VK_LIBRARY"

      - name: Verify native RIFE APK
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libawplayer_rife.so"
          unzip -l "$APK" | grep -q "assets/rife-v4.6/flownet.bin"
          unzip -l "$APK" | grep -q "assets/rife-anime/flownet.bin"
          cp "$APK" ../AWPlayer-v4.9-RIFE-DecoderPhaseLock-v3335.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AWPlayer-v4.9-RIFE-DecoderPhaseLock-v3335
          path: AWPlayer-v4.9-RIFE-DecoderPhaseLock-v3335.apk
          if-no-files-found: error
          retention-days: 14
