      - name: Fetch pinned neural models
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          chmod +x scripts/prepare_rife.sh
          ./scripts/prepare_rife.sh

      - name: Verify v3351 direct-decoder EVSR pipeline
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          AI=app/src/main/java/com/awystudio/awplayer/devclone/ai/Evsr720pEngine.kt
          MAIL=app/src/main/java/com/awystudio/awplayer/devclone/ai/DecoderYuvMailbox.kt
          JNI=app/src/main/cpp/rife_jni.cpp
          CMAKE=app/src/main/cpp/CMakeLists.txt

          grep -q 'versionCode 3351' app/build.gradle
          grep -q "versionName '3.3.51-evsr-direct-decoder-720p'" app/build.gradle
          test -f CURRENT_BUILD_v3351.md
          ! test -f CURRENT_BUILD_v3350.md
          grep -q "tensorflow-lite:2.17.0" app/build.gradle
          grep -q "tensorflow-lite-gpu:2.17.0" app/build.gradle

          test -s app/src/main/assets/evsrnet-720p/evsrnet_x2.tflite
          test "$(stat -c%s app/src/main/assets/evsrnet-720p/evsrnet_x2.tflite)" -eq 68160
          test "$(git hash-object app/src/main/assets/evsrnet-720p/evsrnet_x2.tflite)" = 9ca37aca213dd12a237c6d99d9293c8b0b048523
          test -s app/src/main/assets/licenses/MoViDNN-LICENSE.md
          ! test -e app/src/main/assets/espcn-720p
          ! test -e app/src/main/assets/waifu2x-anime-720p

          grep -q 'class Evsr720pRealtimeEngine' "$AI"
          grep -q 'createCandidate("NNAPI"' "$AI"
          grep -q 'createCandidate("GPU"' "$AI"
          grep -q 'INFERENCE_PREFERENCE_SUSTAINED_SPEED' "$AI"
          grep -q 'resizeInput(0, intArrayOf(1, h, w, 3), false)' "$AI"
          grep -q 'Evsr720pNative.yuv420ToBgrFloat' "$AI"
          grep -q 'Evsr720pNative.bgrFloatToBitmap' "$AI"
          grep -q 'Executors.newSingleThreadExecutor' "$AI"

          grep -q 'class DecoderYuvMailbox' "$MAIL"
          grep -q 'ImageReader.newInstance' "$MAIL"
          grep -q 'ImageFormat.YUV_420_888' "$MAIL"
          grep -q 'acquireLatestImage()' "$MAIL"
          grep -q 'AtomicReference<Image?>' "$MAIL"

          grep -q 'Evsr720pNative_yuv420ToBgrFloat' "$JNI"
          grep -q 'Evsr720pNative_bgrFloatToBitmap' "$JNI"
          grep -q 'Evsr720pNative_yuvLumaHash' "$JNI"
          ! grep -q '#include "waifu2x.h"' "$JNI"
          ! grep -q 'WAIFU2X_ROOT' "$CMAKE"

          grep -q 'val geometry = smart720Geometry(sourceW, sourceH)' "$SRC"
          grep -q 'upscaleEngine.ensureReady(aiInputW, aiInputH)' "$SRC"
          grep -q 'DecoderYuvMailbox(aiInputW, aiInputH)' "$SRC"
          grep -q 'upscaleAheadPlayer.setVideoSurface(mailbox!!.surface)' "$SRC"
          grep -q 'upscaleEngine.upscaleYuv420' "$SRC"
          grep -q 'Texture-fallback' "$SRC"
          grep -q 'p95' "$SRC"
          grep -q 'runs $uniqueRuns' "$SRC"
          grep -q 'droppedMailboxFrames' "$SRC"

          python3 - <<'PYVERIFY'
          from pathlib import Path
          s=Path('app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt').read_text()
          a=s.index('// v3351 EVSRNet 720p Direct-Decoder SR.')
          b=s.index('// Keep the player clean while watching.', a)
          block=s[a:b]
          assert 'player.pause()' not in block, 'SR path must never pause the visible player'
          assert 'videoTextureView?.alpha = 0f' not in block, 'SR path must never hide native video'
          assert 'futureFrames' not in block and 'ArrayDeque<PendingSr>' not in block, 'SR output queue must stay bounded to one frame'
          assert 'pollLatest()' in block, 'direct decoder must consume latest frame only'
          assert 'upscaleEngine.upscaleYuv420' in block, 'YUV direct inference path missing'
          assert 'texture.getBitmap(capture)' in block, 'compatibility fallback missing'
          assert block.index('upscaleEngine.upscaleYuv420') < block.index('texture.getBitmap(capture)'), 'YUV path must be primary, TextureView only fallback'
          print('Direct-decoder / Never-Freeze invariants: OK')
          PYVERIFY

          grep -q 'uniform shader sourceTex;' "$SRC"
          ! grep -q 'uniform shader input;' "$SRC"
          test -f third_party/rife-ncnn-vulkan/src/rife.cpp
          test -f app/src/main/assets/rife-v4.6/flownet.bin
          grep -q 'g_rife->process(in0, in1, t, out)' "$JNI"
          bash -n scripts/prepare_rife.sh
          echo '=== v3351 EVSRNET DIRECT-DECODER 720P PIPELINE VERIFIED ==='

      - name: Build release APK
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          set +e
          set -o pipefail
          LOG="$RUNNER_TEMP/gradle-release.log"
          gradle :app:assembleRelease \
            --stacktrace --no-daemon --console=plain --warning-mode all \
            -PawVkInclude="$AW_VK_INCLUDE_DIR" \
            -PawVkLibrary="$AW_VK_LIBRARY" 2>&1 | tee "$LOG"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::group::Build failure summary"
            grep -nEi '(^e:|(^|[[:space:]])(error:|fatal error:|CMake Error|ninja: build stopped|FAILURE: Build failed|Execution failed for task|A problem occurred|undefined reference|cannot find|No such file|FAILED:))' "$LOG" | tail -n 240 || true
            echo "::endgroup::"
            echo "::group::Last 450 Gradle log lines"
            tail -n 450 "$LOG" || true
            echo "::endgroup::"
          fi
          exit "$code"

      - name: Upload full Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AWPlayer-v3351-gradle-build-log
          path: ${{ runner.temp }}/gradle-release.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify neural APK
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libawplayer_rife.so'
          unzip -l "$APK" | grep -q 'assets/evsrnet-720p/evsrnet_x2.tflite'
          unzip -l "$APK" | grep -q 'assets/licenses/MoViDNN-LICENSE.md'
          unzip -l "$APK" | grep -q 'assets/rife-v4.6/flownet.bin'
          cp "$APK" ../AWPlayer-v4.9-EVSR720p-DirectDecoder-v3351.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AWPlayer-v4.9-EVSR720p-DirectDecoder-v3351
          path: AWPlayer-v4.9-EVSR720p-DirectDecoder-v3351.apk
          if-no-files-found: error
          retention-days: 14
