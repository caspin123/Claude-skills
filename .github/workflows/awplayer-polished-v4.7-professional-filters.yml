        shell: bash
        run: |
          APK=AWPlayer_Polished_v470/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          if command -v apkanalyzer >/dev/null 2>&1; then
            apkanalyzer manifest application-id "$APK" | grep -qx 'com.awystudio.awplayer'
          fi
          cp "$APK" AWPlayer-v4.7-ProfessionalFilters.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AWPlayer-v4.7-ProfessionalFilters
          path: AWPlayer-v4.7-ProfessionalFilters.apk
          if-no-files-found: error
