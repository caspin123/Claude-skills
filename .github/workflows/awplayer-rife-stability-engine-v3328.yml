      - name: Fetch RIFE Anime + ncnn
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          chmod +x scripts/prepare_rife.sh
          ./scripts/prepare_rife.sh

      - name: Verify RIFE native inputs
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          test -f third_party/rife-ncnn-vulkan/src/rife.cpp
          test -f third_party/rife-ncnn-vulkan/src/warp.cpp
          test -f third_party/rife-ncnn-vulkan/src/ncnn/CMakeLists.txt
          test -f app/src/main/assets/rife-v4.6/flownet.param
          test -f app/src/main/assets/rife-v4.6/flownet.bin
          test -f app/src/main/assets/rife-anime/flownet.param
          test -f app/src/main/assets/rife-anime/flownet.bin
          grep -q 'g_rife->process(in0, in1, t, out)' app/src/main/cpp/rife_jni.cpp
          grep -q 'pairs_are_duplicate' app/src/main/cpp/rife_jni.cpp
          grep -q 'Vulkan_LIBRARY' app/src/main/cpp/CMakeLists.txt
          grep -q 'NCNN_SIMPLEVK ON' app/src/main/cpp/CMakeLists.txt
          grep -q 'awVkInclude' app/build.gradle
          grep -q 'awVkLibrary' app/build.gradle

          # v3328 payload identity + render-ahead + Stability Engine checks.
          grep -q 'versionCode 3328' app/build.gradle
          grep -q "versionName '3.3.28-rife-stability-engine'" app/build.gradle
          test -f RIFE_STABILITY_ENGINE_BUILD_3328.txt
          grep -Fq 'val rifeAheadPlayer = remember(uri)' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'Preparing smooth playback' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'val startupAheadMs = 6_000L' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'val targetAheadMs = 8_000L' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'val maxAheadMs = 10_000L' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'val emergencyAheadMs = 1_500L' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'rifeAheadPlayer.setVideoTextureView' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'withContext(Dispatchers.Default)' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'Ahead ${String.format(Locale.US, "%.1f", rifeAheadMs / 1000f)}s' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'pair_is_scene_cut' app/src/main/cpp/rife_jni.cpp
          grep -Fq 'pair_is_effect_risky' app/src/main/cpp/rife_jni.cpp
          grep -Fq 'generated_output_is_suspicious' app/src/main/cpp/rife_jni.cpp
          grep -Fq 'AW_RESULT_SCENE_CUT = -51' app/src/main/cpp/rife_jni.cpp
          grep -Fq 'AW_RESULT_ARTIFACT_REJECTED = -52' app/src/main/cpp/rife_jni.cpp
          grep -Fq 'rifeSceneCutSkips' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'rifeArtifactSkips' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'Stable Subtitle Plane' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'stableMediaPts' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'preferredDisplayModeId' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'rifeBlendFallbackFrames' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'Anime Motion Guard' app/src/main/cpp/rife_jni.cpp
          grep -Fq 'AW_RESULT_SAFE_BLEND = -53' app/src/main/cpp/rife_jni.cpp
          grep -Fq 'write_linear_midpoint_to_bitmap' app/src/main/cpp/rife_jni.cpp
          grep -Fq 'data object SafeBlend' app/src/main/java/com/awystudio/awplayer/devclone/ai/RifeNative.kt
          echo '=== RIFE STABILITY-ENGINE PAYLOAD v3328 VERIFIED ==='
          grep 'versionCode 3328' app/build.gradle

      - name: Build release APK
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          gradle :app:assembleRelease --stacktrace --no-daemon \
            -PawVkInclude="$AW_VK_INCLUDE_DIR" \
            -PawVkLibrary="$AW_VK_LIBRARY"

      - name: Verify native RIFE APK
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libawplayer_rife.so"
