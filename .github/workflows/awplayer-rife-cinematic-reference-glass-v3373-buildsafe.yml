      - name: Preflight v3373 reference UI + playback invariants
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          FSR=app/src/main/java/com/awystudio/awplayer/devclone/player/FsrVideoView.kt
          JNI=app/src/main/cpp/rife_jni.cpp

          grep -q 'versionCode 3373' app/build.gradle
          grep -q "versionName '3.3.73-cinematic-reference-glass'" app/build.gradle
          grep -q "applicationId 'com.awystudio.awplayer'" app/build.gradle
          ! grep -q 'android:appCategory="game"' app/src/main/AndroidManifest.xml
          grep -q 'android:label="AW Player"' app/src/main/AndroidManifest.xml
          grep -q 'com.awystudio.awplayer.activities.StreamVideoPlayerActivity' app/src/main/AndroidManifest.xml
          grep -q 'android:scheme="anime_witcher" android:host="play"' app/src/main/AndroidManifest.xml
          test -f CURRENT_BUILD_v3373.md
          ! test -d bridge
          grep -q "include ':app'" settings.gradle
          ! grep -q "':bridge'" settings.gradle

          test -s app/src/main/assets/fsr/fsr1_easu.frag
          test -s app/src/main/assets/fsr/fsr1_rcas.frag
          test -s app/src/main/assets/fsr/LICENSE
          grep -q 'FidelityFX Super Resolution 1.0 EASU' app/src/main/assets/fsr/fsr1_easu.frag
          grep -q 'easuTap' app/src/main/assets/fsr/fsr1_easu.frag
          grep -q 'FSR_RCAS_DENOISE' app/src/main/assets/fsr/fsr1_rcas.frag
          grep -q 'Copyright (c) 2021 Advanced Micro Devices' app/src/main/assets/fsr/LICENSE

          grep -q 'class FsrVideoView' "$FSR"
          grep -q 'GLES11Ext.GL_TEXTURE_EXTERNAL_OES' "$FSR"
          grep -q 'SurfaceTexture(oesTexture)' "$FSR"
          grep -q 'RESTORE_FRAGMENT_SHADER' "$FSR"
          grep -q 'private var restoreFbo = 0' "$FSR"
          grep -q 'drawRestore()' "$FSR"
          grep -q 'drawEasu(fsrInputTexture)' "$FSR"
          grep -q '2D MOBILE RESTORE + AMD FSR1 VERIFIED' "$FSR"
          grep -q 'presentationTexture = if (comparingOriginal) inputTexture else srTexture' "$FSR"
          grep -q 'Never reject an acquired SurfaceTexture frame based on timestamp alone' "$FSR"
          grep -q 'var onFatal: ((String) -> Unit)? = null' "$FSR"
          grep -q 'signalFatal("no decoder frames reached the FSR SurfaceTexture")' "$FSR"
          grep -q 'GL render failure:' "$FSR"

          # v3373 Hyper/FHD invariants: the stable modes stay 720p and Hyper is a distinct 1080p path.
          grep -q 'val needs720pSpatialSr = sourceHeight in 1..719 && sourceWidth in 1..1279' "$SRC"
          grep -q 'val needs1080pHyperSr = sourceHeight in 720..1079 && sourceWidth in 1..1919' "$SRC"
          grep -q 'smartEnhancerMode == "Hyper"' "$SRC"
          grep -q 'private fun smart720Geometry' "$SRC"
          grep -q 'private fun smart1080Geometry' "$SRC"
          grep -q '1920f / sourceW.toFloat(), 1080f / sourceH.toFloat()' "$SRC"
          grep -q 'listOf("Off", "Quality", "Hyper")' "$SRC"
          grep -q 'Hyper 1080p enhancer enabled' "$SRC"
          grep -q 'Hyper FSR1 1080p' "$SRC"
          # Native FHD must filter at 1:1 without triggering an upscale.
          grep -q 'val nativeFhdFilterActive' "$SRC"
          grep -q 'sourceHeight in 1000..1100' "$SRC"
          grep -q 'smartEnhance.copy(superRes = 0f)' "$SRC"
          grep -q 'fine = enhance' "$SRC"
          grep -q 'Native FHD filters • 1:1' "$SRC"
          grep -q 'Native FHD • Smart/Detail/Color • 1:1' "$SRC"
          # v3373 retained Cast Stop fix: the cast screen must own pointer input while connected.
          grep -q 'red Stop Cast button' "$SRC"
          grep -Fq 'AnimatedVisibility((controls || locked) && !castConnected' "$SRC"
          grep -Fq 'val activeSession = castSession ?: castContext?.sessionManager?.currentCastSession' "$SRC"
          grep -Fq 'castMessage = "Stopping Private Cast…"' "$SRC"
          grep -q 'frames D/M/E/R' "$SRC"
          grep -q 'FsrVideoView(ctx)' "$SRC"
          grep -Fq 'smartEnhancerMode == "Quality" || smartEnhancerMode == "Hyper",' "$SRC"
          grep -Fq 'smartEnhancerMode == "Hyper",' "$SRC"
          grep -q '@Volatile private var hyperMode = false' "$FSR"
          grep -q 'val maxW = if (hyperMode) 1920 else 1280' "$FSR"
          grep -q 'val maxH = if (hyperMode) 1080 else 720' "$FSR"
          ! grep -q 'upscaleAheadPlayer' "$SRC"
          ! grep -q 'upscaleOverlayView' "$SRC"
          ! grep -q 'Evsr720pRealtimeEngine' "$SRC"
          ! grep -q 'DecoderYuvMailbox' "$SRC"
          ! grep -q 'tensorflow-lite' app/build.gradle

          # Absolutely no REDMAGIC/COD/Game Space runtime integration in the app module.
          ! grep -RniE 'redmagic|callofduty|GameDisplayMagic|mindsync|persist\.maso|persist\.magic\.super\.resolution' app --exclude='*.webp'
          ! grep -Rni 'SystemProperties' app/src/main
          ! grep -Rni 'Settings.Global' app/src/main

          # v3373 approved-reference landscape UI invariants: compile-facing symbols must exist.
          grep -q 'LocalContentColor provides AwText' app/src/main/java/com/awystudio/awplayer/devclone/ui/theme/Theme.kt
          grep -q 'val AwText = Color(0xFFF4F9FF)' app/src/main/java/com/awystudio/awplayer/devclone/ui/theme/Theme.kt
          grep -q 'val AwMuted = Color(0xFFA3B2C2)' app/src/main/java/com/awystudio/awplayer/devclone/ui/theme/Theme.kt
          grep -q 'val AwCyan = Color' app/src/main/java/com/awystudio/awplayer/devclone/ui/theme/Theme.kt
          grep -q 'val AwBlue = Color' app/src/main/java/com/awystudio/awplayer/devclone/ui/theme/Theme.kt
          grep -q 'Cinematic Glass Player' app/src/main/java/com/awystudio/awplayer/devclone/MainActivity.kt
          grep -q 'private fun PlayerEnhancerChip' "$SRC"
          grep -Fq 'PlayerEnhancerChip("RIFE"' "$SRC"
          grep -Fq 'PlayerEnhancerChip("HYPER"' "$SRC"
          grep -Fq 'PlayerEnhancerMiniChip("RIFE"' "$SRC"
          grep -Fq 'PlayerEnhancerMiniChip("HYPER"' "$SRC"
          grep -Fq 'val isLandscape = LocalConfiguration.current.orientation' "$SRC"
          grep -Fq 'Modifier.fillMaxWidth().height(50.dp)' "$SRC"
          grep -q 'private fun PlayerSeekBar' "$SRC"
          grep -q 'private fun PlayerDockAction' "$SRC"
          grep -Fq 'Color.Black.copy(alpha=.72f)' "$SRC"
          grep -Fq 'AwCyan.copy(alpha=.44f)' "$SRC"
          grep -Fq 'heightIn(min = if (isLandscape) 54.dp else 0.dp)' "$SRC"
          grep -Fq 'val playButtonSize = if (isLandscape) 62.dp else 64.dp' "$SRC"
          grep -Fq 'Row(Modifier.height(24.dp).padding(horizontal = 5.dp)' "$SRC"
          grep -Fq 'Color.Black.copy(alpha=.28f)' "$SRC"

          # v3373 retains Kotlin/Compose padding fix: use start/top/end/bottom when mixed axes are needed.
          grep -Fq 'start = if (isLandscape) 16.dp else 9.dp,' "$SRC"
          grep -Fq 'end = if (isLandscape) 16.dp else 9.dp,' "$SRC"
          grep -Fq 'start = if (isLandscape) 16.dp else 14.dp,' "$SRC"
          grep -Fq 'end = if (isLandscape) 16.dp else 14.dp,' "$SRC"
          ! grep -Fq 'horizontal = if (isLandscape) 16.dp else 9.dp,' "$SRC"
          ! grep -Fq 'horizontal = if (isLandscape) 16.dp else 14.dp,' "$SRC"

          python3 - <<'PYVERIFY'
          from pathlib import Path
          import re
          s=Path('app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt').read_text()
          f=Path('app/src/main/java/com/awystudio/awplayer/devclone/player/FsrVideoView.kt').read_text()
          easu=Path('app/src/main/assets/fsr/fsr1_easu.frag').read_text()
          rcas=Path('app/src/main/assets/fsr/fsr1_rcas.frag').read_text()


          # Reject mixed Compose padding overloads such as horizontal + top/bottom.
          needle = '.padding('
          pos = 0
          while True:
              start = s.find(needle, pos)
              if start < 0:
                  break
              i = start + len(needle)
              depth = 1
              j = i
              while j < len(s) and depth:
                  if s[j] == '(':
                      depth += 1
                  elif s[j] == ')':
                      depth -= 1
                  j += 1
              args = s[i:j-1]
              assert not ('horizontal =' in args and ('top =' in args or 'bottom =' in args)), (start, args)
              pos = j

          # Current v3363 geometry must remain exactly max 1280x720.
          a=s.index('private fun smart720Geometry')
          b=s.index('private fun smart1080Geometry', a)
          g720=s[a:b]
          assert '1280f / sourceW.toFloat(), 720f / sourceH.toFloat()' in g720
          assert 'coerceAtMost(1280)' in g720 and 'coerceAtMost(720)' in g720
          assert 'sourceW / 2' not in g720 and 'sourceH / 2' not in g720

          # Hyper is deliberately separate and maps a 1280x720 source to 1920x1080.
          c=s.index('private fun smart1080Geometry')
          d=s.index('private data class SmartEnhancerParams', c)
          g1080=s[c:d]
          assert '1920f / sourceW.toFloat(), 1080f / sourceH.toFloat()' in g1080
          assert 'coerceAtMost(1920)' in g1080 and 'coerceAtMost(1080)' in g1080

          def even_floor(v): return max(2, (max(2, int(v)) // 2) * 2)
          def geom(w,h,mw,mh):
              scale=max(1.0, min(mw/w, mh/h))
              return min(even_floor(w*scale), mw), min(even_floor(h*scale), mh)
          assert geom(848,480,1280,720) == (1272,720)
          assert geom(1280,720,1920,1080) == (1920,1080)
          assert geom(1272,720,1920,1080) == (1908,1080)

          assert 'ImageView(' not in f and 'import android.graphics.Bitmap' not in f and 'TextureView.getBitmap' not in f
          assert 'player.pause()' not in f
          assert 'updateTexImage()' in f
          assert 'drawOes()' in f and 'drawRestore()' in f and 'drawEasu(fsrInputTexture)' in f
          assert 'restoreFrames++' in f and 'easuFrames++' in f and 'rcasFrames++' in f
          assert 'presentationTexture = if (comparingOriginal) inputTexture else srTexture' in f
          assert '@Volatile private var hyperMode = false' in f
          assert 'val maxW = if (hyperMode) 1920 else 1280' in f
          assert 'val maxH = if (hyperMode) 1080 else 720' in f
          assert 'val needs1080pHyperSr = sourceHeight in 720..1079' in s
          assert 'listOf("Off", "Quality", "Hyper")' in s
          assert 'Hyper 1080p enhancer enabled' in s
          # FHD is native-size filtering only: Smart/Detail/Color share one RuntimeShader.
          assert 'val nativeFhdFilterActive' in s and 'sourceHeight in 1000..1100' in s
          assert 'smartEnhance.copy(superRes = 0f)' in s
          assert 'fine = enhance' in s
          assert '(smart.sharpenBoost + fine.sharpen).coerceIn(0f, 0.70f)' in s
          assert 'maxOf(smart.cleanup, fine.cleanup)' in s
          assert 'maxOf(smart.dither, fine.dither)' in s
          assert 'Native FHD filters • no resize' in s
          # Stop Cast must be above/independent of the normal full-screen gesture layer.
          cast_screen = s.index('if (castConnected) {', s.index('Private Cast'))
          cast_gesture_fix = s.index('// v3366: while Private Cast is active', cast_screen)
          cast_controls_fix = s.index('AnimatedVisibility((controls || locked) && !castConnected', cast_gesture_fix)
          assert cast_screen < cast_gesture_fix < cast_controls_fix
          assert 'val activeSession = castSession ?: castContext?.sessionManager?.currentCastSession' in s
          assert 'endCurrentSession(true)' in s[cast_screen:cast_gesture_fix]
          assert 'easuSet' in easu and 'easuTap' in easu
          assert 'uSharpness' in rcas and 'exp2(-clamp(uSharpness' in rcas
          assert "applicationId 'com.awystudio.awplayer'" in Path('app/build.gradle').read_text()
          assert 'REDMAGIC' not in f and 'callofduty' not in f.lower()

          # Critical stable-OES invariant preserved from v3363: one external texture sample only.
          oes=f.split('private const val OES_FRAGMENT_SHADER =',1)[1].split('private const val RESTORE_FRAGMENT_SHADER =',1)[0]
          assert oes.count('texture(uTex') == 1, oes
          assert 'uRestoreStrength' not in oes and 'uSourceTexel' not in oes and 'tap(' not in oes
          restore=f.split('private const val RESTORE_FRAGMENT_SHADER =',1)[1].split('private const val BLIT_FRAGMENT_SHADER =',1)[0]
          assert 'uniform sampler2D uTex' in restore
          assert 'uRestoreStrength' in restore and 'darkLine=edge*structure' in restore
          assert 'samplerExternalOES' not in restore
          assert 'private fun PlayerSeekBar' in s
          assert 'private fun PlayerDockAction' in s
          assert 'Modifier.fillMaxWidth().height(50.dp)' in s
          assert 'heightIn(min = if (isLandscape) 54.dp else 0.dp)' in s
          assert 'val playButtonSize = if (isLandscape) 62.dp else 64.dp' in s
          assert 'Row(Modifier.height(24.dp).padding(horizontal = 5.dp)' in s
          assert 'Color.Black.copy(alpha=.72f)' in s
          assert 'Color.Black.copy(alpha=.28f)' in s
          assert 'PlayerDockAction(Icons.Outlined.AutoAwesome, "Enhance"' in s
          print('v3373 approved-reference Glass UI + Kotlin fix + playback invariants: OK')
          PYVERIFY

          test -f third_party/rife-ncnn-vulkan/src/rife.cpp
          test -f app/src/main/assets/rife-v4.6/flownet.bin
          grep -q 'g_rife->process(in0, in1, t, out)' "$JNI"
          bash -n scripts/prepare_rife.sh
          echo '=== v3373 REFERENCE GLASS UI + PLAYBACK PREFLIGHT VERIFIED ==='

      - name: Verify Gradle / Android build toolchain
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" version
          APKANALYZER_BIN="$(command -v apkanalyzer || true)"
          if [ -z "$APKANALYZER_BIN" ]; then APKANALYZER_BIN="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer"; fi
          test -x "$APKANALYZER_BIN"
          echo "APKANALYZER_BIN=$APKANALYZER_BIN" >> "$GITHUB_ENV"
          test -d "$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          test -x "$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake"
          test -f "$AW_VK_INCLUDE_DIR/vulkan/vulkan.h"
          test -f "$AW_VK_LIBRARY"
          grep -q "id 'com.android.application' version '8.9.1'" build.gradle
          grep -q "id 'org.jetbrains.kotlin.android' version '2.2.20'" build.gradle
          grep -q "id 'org.jetbrains.kotlin.plugin.compose' version '2.2.20'" build.gradle
          echo 'AGP 8.9.1 + Gradle 8.11.1 + Kotlin 2.2.20 + JDK 17 + API 35 toolchain: OK'

      - name: Build APK
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          set +e
          set -o pipefail
          LOG="$RUNNER_TEMP/gradle-release.log"
          gradle :app:assembleRelease \
            --stacktrace --no-daemon --console=plain --warning-mode all \
            -PawVkInclude="$AW_VK_INCLUDE_DIR" \
            -PawVkLibrary="$AW_VK_LIBRARY" 2>&1 | tee "$LOG"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::group::Build failure summary"
            grep -nEi '(^e:|(^|[[:space:]])(error:|fatal error:|CMake Error|ninja: build stopped|FAILURE: Build failed|Execution failed for task|A problem occurred|undefined reference|cannot find|No such file|FAILED:))' "$LOG" | tail -n 300 || true
            echo "::endgroup::"
            echo "::group::Last 600 Gradle log lines"
            tail -n 600 "$LOG" || true
            echo "::endgroup::"
          fi
          exit "$code"

