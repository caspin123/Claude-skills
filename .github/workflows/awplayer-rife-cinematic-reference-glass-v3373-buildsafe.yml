          test -x "$APKSIGNER_BIN"
          "$APKSIGNER_BIN" verify --verbose --print-certs "$APK"
          cp "$APK" ../AWPlayer-v3373-Cinematic-Reference-Glass-Hyper1080p-RIFE-CastStop.apk
          test -s ../AWPlayer-v3373-Cinematic-Reference-Glass-Hyper1080p-RIFE-CastStop.apk
