      - name: Verify HQ hybrid payload
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          test -f third_party/rife-ncnn-vulkan/src/rife.cpp
          test -f third_party/rife-ncnn-vulkan/src/warp.cpp
          test -f third_party/rife-ncnn-vulkan/src/ncnn/CMakeLists.txt
          test -f app/src/main/assets/rife-v4.6/flownet.param
          test -f app/src/main/assets/rife-v4.6/flownet.bin
          test -f app/src/main/assets/rife-anime/flownet.param
          test -f app/src/main/assets/rife-anime/flownet.bin
          grep -q 'Vulkan_LIBRARY' app/src/main/cpp/CMakeLists.txt
          grep -q 'NCNN_SIMPLEVK ON' app/src/main/cpp/CMakeLists.txt
          grep -q 'awVkInclude' app/build.gradle
          grep -q 'awVkLibrary' app/build.gradle
          grep -q 'versionCode 3331' app/build.gradle
          grep -q "versionName '3.3.31-rife-hq-hybrid'" app/build.gradle
          test -f RIFE_HQ_HYBRID_BUILD_3331.txt
          grep -Fq 'v3331 HQ Hybrid Presentation' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'fun showRifeMidpoint(bitmap: Bitmap)' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'videoTextureView?.alpha = 1f' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'when (guardLevel) { 0 -> 640; 1 -> 544; else -> 448 }' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'when (guardLevel) { 0 -> 768; 1 -> 640; else -> 512 }' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'AheadSlot(output, midpointPtsMs, endPtsMs, generated = true)' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          if grep -Fq 'videoTextureView?.alpha = 0f' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt; then
            echo 'ERROR: old low-resolution single-plane source hiding is still present'
            exit 1
          fi
          if grep -Fq 'var endFrame: Bitmap?' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt; then
            echo 'ERROR: low-resolution source frame queue still present'
            exit 1
          fi
          grep -Fq 'stableMediaPts' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'preferredDisplayModeId' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'pair_is_scene_cut' app/src/main/cpp/rife_jni.cpp
          grep -Fq 'generated_output_is_suspicious' app/src/main/cpp/rife_jni.cpp
          echo '=== RIFE HQ HYBRID PAYLOAD v3331 VERIFIED ==='

