name: Build AW Player v4.9 RIFE v4.6 + DupSkip

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - ".github/workflows/awplayer-polished-v4.9-rife-phase2.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK + NDK + CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Resolve Android NDK Vulkan paths
        shell: bash
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          SYSROOT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          VK_INC="$SYSROOT/usr/include"
          # minSdk is 23; Vulkan stubs exist from API 24 upward.
          VK_LIB="$SYSROOT/usr/lib/aarch64-linux-android/24/libvulkan.so"
          test -f "$VK_LIB"
          test -f "$VK_INC/vulkan/vulkan.h"
          echo "AW_VK_INCLUDE_DIR=$VK_INC" >> "$GITHUB_ENV"
          echo "AW_VK_LIBRARY=$VK_LIB" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

