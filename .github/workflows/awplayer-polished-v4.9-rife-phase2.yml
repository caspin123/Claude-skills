      - name: Fetch RIFE Anime + ncnn
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          chmod +x scripts/prepare_rife.sh
          ./scripts/prepare_rife.sh

      - name: Verify RIFE native inputs
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          test -f third_party/rife-ncnn-vulkan/src/rife.cpp
          test -f third_party/rife-ncnn-vulkan/src/warp.cpp
          test -f third_party/rife-ncnn-vulkan/src/ncnn/CMakeLists.txt
          test -f app/src/main/assets/rife-anime/flownet.param
          test -f app/src/main/assets/rife-anime/flownet.bin
          test -f app/src/main/assets/rife-anime/contextnet.param
          test -f app/src/main/assets/rife-anime/contextnet.bin
          test -f app/src/main/assets/rife-anime/fusionnet.param
          test -f app/src/main/assets/rife-anime/fusionnet.bin
          grep -q 'g_rife->process(in0, in1, 0.5f, out)' app/src/main/cpp/rife_jni.cpp
          grep -q 'versionCode 3313' app/build.gradle
          grep -q 'late AI frame skipped' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -q 'Smart AI • Detail • Color' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt

      - name: Build release APK
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          gradle :app:assembleRelease --stacktrace --no-daemon \
            -PawVkInclude="$AW_VK_INCLUDE_DIR" \
            -PawVkLibrary="$AW_VK_LIBRARY"

      - name: Verify native RIFE APK
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libawplayer_rife.so"
          unzip -l "$APK" | grep -q "assets/rife-anime/flownet.bin"
          unzip -l "$APK" | grep -q "assets/rife-anime/contextnet.bin"
          unzip -l "$APK" | grep -q "assets/rife-anime/fusionnet.bin"
          cp "$APK" ../AWPlayer-v4.9-RIFE-Smooth-Fix.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AWPlayer-v4.9-RIFE-Smooth-Fix
          path: AWPlayer-v4.9-RIFE-Smooth-Fix.apk
          if-no-files-found: error
          retention-days: 14
