      - name: Fetch RIFE Anime + ncnn
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          chmod +x scripts/prepare_rife.sh
          ./scripts/prepare_rife.sh

      - name: Verify RIFE native inputs
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          test -f third_party/rife-ncnn-vulkan/src/rife.cpp
          test -f third_party/rife-ncnn-vulkan/src/warp.cpp
          test -f third_party/rife-ncnn-vulkan/src/ncnn/CMakeLists.txt
          # Primary model: single-network v4.6.
          test -f app/src/main/assets/rife-v4.6/flownet.param
          test -f app/src/main/assets/rife-v4.6/flownet.bin
          # Fallback model kept for devices where v4 fails to load.
          test -f app/src/main/assets/rife-anime/flownet.param
          test -f app/src/main/assets/rife-anime/flownet.bin
          test -f app/src/main/assets/rife-anime/contextnet.bin
          test -f app/src/main/assets/rife-anime/fusionnet.bin
          grep -q 'g_rife->process(in0, in1, t, out)' app/src/main/cpp/rife_jni.cpp
          grep -q 'pairs_are_duplicate' app/src/main/cpp/rife_jni.cpp
          grep -q 'bitmap_to_packed_rgb' app/src/main/cpp/rife_jni.cpp
          grep -q 'ncnn::Mat out(in0.w, in0.h' app/src/main/cpp/rife_jni.cpp
          grep -q 'lastFailure' app/src/main/java/com/awystudio/awplayer/devclone/ai/RifeNative.kt
          grep -q 'Vulkan_LIBRARY' app/src/main/cpp/CMakeLists.txt
          grep -q 'versionCode 3318' app/build.gradle

      - name: Build release APK
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          gradle :app:assembleRelease --stacktrace --no-daemon \
            -PawVkInclude="$AW_VK_INCLUDE_DIR" \
            -PawVkLibrary="$AW_VK_LIBRARY"

      - name: Verify native RIFE APK
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libawplayer_rife.so"
          unzip -l "$APK" | grep -q "assets/rife-v4.6/flownet.bin"
          unzip -l "$APK" | grep -q "assets/rife-anime/flownet.bin"
          cp "$APK" ../AWPlayer-v4.9-RIFE-v46-DupSkip.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AWPlayer-v4.9-RIFE-v46-DupSkip
          path: AWPlayer-v4.9-RIFE-v46-DupSkip.apk
          if-no-files-found: error
          retention-days: 14
