          # v3377 retains Kotlin/Compose padding fix: use start/top/end/bottom when mixed axes are needed.
          grep -Fq 'start = if (isLandscape) 16.dp else 16.dp,' "$SRC"
          grep -Fq 'end = if (isLandscape) 16.dp else 16.dp,' "$SRC"
          grep -Fq 'bottom = if (isLandscape) 7.dp else 12.dp' "$SRC"
