      - name: Fetch RIFE + waifu2x Anime 720p model
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          chmod +x scripts/prepare_rife.sh
          ./scripts/prepare_rife.sh

      - name: Verify v3349 Smart 720p neural pipeline
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          AI=app/src/main/java/com/awystudio/awplayer/devclone/ai/Anime720pNative.kt
          JNI=app/src/main/cpp/rife_jni.cpp
          CMAKE=app/src/main/cpp/CMakeLists.txt

          grep -q 'versionCode 3349' app/build.gradle
          grep -q "versionName '3.3.49-smart-720p-waifu2x'" app/build.gradle
          test -f CURRENT_BUILD_v3349.md
          ! test -f CURRENT_BUILD_v3348.md

          test -s app/src/main/assets/waifu2x-anime-720p/scale2.0x_model.param
          test -s app/src/main/assets/waifu2x-anime-720p/scale2.0x_model.bin
          grep -q 'class Anime720pRealtimeEngine' "$AI"
          grep -q 'object Anime720pNative' "$AI"
          grep -q 'MODEL_DIR = "waifu2x-anime-720p"' "$AI"
          grep -q 'nativeUpscale2x' "$AI"
          grep -q 'nativeNearDuplicate' "$AI"
          grep -Fq 'private fun copyAssetTree(assetPath: String, dest: File): String? {' "$AI"
          ! grep -Fq 'copyAssetTree(assetPath: String, dest: File): String? = try' "$AI"

          grep -q '#include "waifu2x.h"' "$JNI"
          grep -q 'std::unique_ptr<Waifu2x> g_upscaler' "$JNI"
          grep -q 'std::make_unique<Waifu2x>' "$JNI"
          grep -q 'engine->prepadding = 7' "$JNI"
          grep -Fq 'outInfo.width != inInfo.width * 2' "$JNI"
          grep -q 'nativeUpscalerInit' "$JNI"
          grep -q 'nativeUpscale2x' "$JNI"

          grep -q 'waifu2x.cpp' "$CMAKE"
          grep -q 'waifu2x_preproc.comp' "$CMAKE"
          grep -q 'aw_w2x_shaders' "$CMAKE"
          ! grep -q 'realesrgan.cpp' "$CMAKE"
          ! grep -q 'REALESRGAN_SRC' "$CMAKE"
          ! grep -q 'set(WITH_LAYER_' "$CMAKE"
          grep -q -- '--branch 20221029' scripts/prepare_rife.sh
          grep -q -- '--branch 20220728' scripts/prepare_rife.sh
          grep -q 'models-upconv_7_anime_style_art_rgb' scripts/prepare_rife.sh

          grep -q 'val needs720pNeuralSr = sourceHeight <= 0 || sourceHeight < 720' "$SRC"
          grep -q 'val targetW = if (nearSixteenNine) 1280' "$SRC"
          grep -q 'val targetH = if (nearSixteenNine) 720' "$SRC"
          grep -q 'val aiInputW = evenFloor(targetW / 2)' "$SRC"
          grep -q 'val aiInputH = evenFloor(targetH / 2)' "$SRC"
          grep -q 'Bitmap.createBitmap(aiInputW, aiInputH' "$SRC"
          grep -q 'upscaleEngine.upscale2x' "$SRC"
          grep -q 'waifu2x 720p x2' "$SRC"
          grep -q 'isNearDuplicate' "$SRC"
          grep -Fq 'val tileSize = 256' "$SRC"
          grep -Fq 'Realtime bridge' "$SRC"
          ! grep -q 'Real-ESRGAN AnimeVideo-v3 2× neural upscaling' "$SRC"

          grep -q 'uniform shader sourceTex;' "$SRC"
          ! grep -q 'uniform shader input;' "$SRC"
          test -f third_party/rife-ncnn-vulkan/src/rife.cpp
          test -f app/src/main/assets/rife-v4.6/flownet.bin
          test -f app/src/main/assets/rife-anime/flownet.bin
          grep -q 'g_rife->process(in0, in1, t, out)' "$JNI"

          echo '=== v3349 SMART 720P WAIFU2X NEURAL SR PIPELINE VERIFIED ==='

      - name: Build release APK
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          set +e
          set -o pipefail
          LOG="$RUNNER_TEMP/gradle-release.log"
          gradle :app:assembleRelease \
            --stacktrace --no-daemon --console=plain --warning-mode all \
            -PawVkInclude="$AW_VK_INCLUDE_DIR" \
            -PawVkLibrary="$AW_VK_LIBRARY" 2>&1 | tee "$LOG"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::group::Build failure summary"
            grep -nEi '(^e:|(^|[[:space:]])(error:|fatal error:|CMake Error|ninja: build stopped|FAILURE: Build failed|Execution failed for task|A problem occurred|undefined reference|cannot find|No such file|FAILED:))' "$LOG" | tail -n 180 || true
            echo "::endgroup::"
            echo "::group::Last 350 Gradle log lines"
            tail -n 350 "$LOG" || true
            echo "::endgroup::"
          fi
          exit "$code"

      - name: Upload full Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AWPlayer-v3349-gradle-build-log
          path: ${{ runner.temp }}/gradle-release.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify native AI APK
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libawplayer_rife.so'
          unzip -l "$APK" | grep -q 'assets/waifu2x-anime-720p/scale2.0x_model.param'
          unzip -l "$APK" | grep -q 'assets/waifu2x-anime-720p/scale2.0x_model.bin'
          unzip -l "$APK" | grep -q 'assets/rife-v4.6/flownet.bin'
          cp "$APK" ../AWPlayer-v4.9-Smart720p-Waifu2x-v3349.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AWPlayer-v4.9-Smart720p-Waifu2x-v3349
          path: AWPlayer-v4.9-Smart720p-Waifu2x-v3349.apk
          if-no-files-found: error
          retention-days: 14
