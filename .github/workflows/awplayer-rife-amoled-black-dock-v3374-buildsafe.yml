          APKSIGNER_BIN="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER_BIN"
          "$APKSIGNER_BIN" verify --verbose --print-certs "$APK"
          cp "$APK" ../AWPlayer-v3374-Cinematic-Reference-Glass-Hyper1080p-RIFE-CastStop.apk
          test -s ../AWPlayer-v3374-Cinematic-Reference-Glass-Hyper1080p-RIFE-CastStop.apk
          echo '=== v3374 APK IDENTITY / SIGNATURE / AI ASSETS VERIFIED ===' 

      - name: Upload APK
        uses: actions/upload-artifact@v4
