      - name: Fetch RIFE + Real-ESRGAN AnimeVideo-v3 x2
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          chmod +x scripts/prepare_rife.sh
          ./scripts/prepare_rife.sh

      - name: Verify v3346 genuine x2 pipeline
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          AI=app/src/main/java/com/awystudio/awplayer/devclone/ai/RealEsrganNative.kt
          JNI=app/src/main/cpp/rife_jni.cpp
          CMAKE=app/src/main/cpp/CMakeLists.txt

          grep -q 'versionCode 3346' app/build.gradle
          grep -q "versionName '3.3.46-real-esrgan-x2-buildfix'" app/build.gradle
          test -f CURRENT_BUILD_v3346.md

          test -s app/src/main/assets/realesrgan-anime-x2/realesr-animevideov3-x2.param
          test -s app/src/main/assets/realesrgan-anime-x2/realesr-animevideov3-x2.bin
          grep -q 'class RealEsrganRealtimeEngine' "$AI"
          grep -q 'nativeUpscale2x' "$AI"
          grep -q 'nativeNearDuplicate' "$AI"
          grep -q 'RealESRGAN' "$JNI"
          grep -q 'nativeUpscalerInit' "$JNI"
          grep -q 'nativeUpscale2x' "$JNI"
          grep -Fq 'outInfo.width != inInfo.width * 2' "$JNI"
          grep -q 'realesrgan.cpp' "$CMAKE"
          grep -q 'realesrgan_preproc.comp' "$CMAKE"
          grep -q 'glslangValidator' "$CMAKE"
          grep -q 'NO_CMAKE_FIND_ROOT_PATH' "$CMAKE"
          ! grep -q 'set(WITH_LAYER_' "$CMAKE"
          grep -q -- '--branch 20221029' scripts/prepare_rife.sh
          grep -q -- '--branch v0.2.0' scripts/prepare_rife.sh

          grep -q 'val realUpscaleActive' "$SRC"
          grep -q 'upscaleEngine.upscale2x' "$SRC"
          grep -Fq 'sourceW * 2' "$SRC"
          grep -q 'Real-ESRGAN x2' "$SRC"
          grep -q 'isNearDuplicate' "$SRC"
          grep -q 'upscaleAheadPlayer.pause' "$SRC"

          grep -q 'uniform shader sourceTex;' "$SRC"
          ! grep -q 'uniform shader input;' "$SRC"
          test -f third_party/rife-ncnn-vulkan/src/rife.cpp
          test -f app/src/main/assets/rife-v4.6/flownet.bin
          test -f app/src/main/assets/rife-anime/flownet.bin
          grep -q 'g_rife->process(in0, in1, t, out)' "$JNI"

          echo '=== v3346 REAL-ESRGAN ANIMEVIDEOV3 X2 PIPELINE VERIFIED ==='

      - name: Build release APK
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          set +e
          set -o pipefail
          LOG="$RUNNER_TEMP/gradle-release.log"
          gradle :app:assembleRelease \
            --stacktrace --no-daemon --console=plain --warning-mode all \
            -PawVkInclude="$AW_VK_INCLUDE_DIR" \
            -PawVkLibrary="$AW_VK_LIBRARY" 2>&1 | tee "$LOG"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::group::Build failure summary"
            grep -nEi '(^|[[:space:]])(error:|fatal error:|CMake Error|ninja: build stopped|FAILURE: Build failed|Execution failed for task|A problem occurred|undefined reference|cannot find|No such file|FAILED:)' "$LOG" | tail -n 160 || true
            echo "::endgroup::"
            echo "::group::Last 300 Gradle log lines"
            tail -n 300 "$LOG" || true
            echo "::endgroup::"
          fi
          exit "$code"

      - name: Upload full Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AWPlayer-v3346-gradle-build-log
          path: ${{ runner.temp }}/gradle-release.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify native AI APK
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libawplayer_rife.so'
          unzip -l "$APK" | grep -q 'assets/realesrgan-anime-x2/realesr-animevideov3-x2.param'
          unzip -l "$APK" | grep -q 'assets/realesrgan-anime-x2/realesr-animevideov3-x2.bin'
          unzip -l "$APK" | grep -q 'assets/rife-v4.6/flownet.bin'
          cp "$APK" ../AWPlayer-v4.9-RealESRGAN-x2-v3346.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AWPlayer-v4.9-RealESRGAN-x2-v3346
          path: AWPlayer-v4.9-RealESRGAN-x2-v3346.apk
          if-no-files-found: error
          retention-days: 14
