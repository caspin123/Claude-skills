      - name: Verify enhancer source
        shell: bash
        run: |
          P=AWPlayer_Polished_v480/app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -q '@UnstableApi' "$P"
          grep -q 'uSuperRes' "$P"
          grep -q 'uEdgeRecover' "$P"
          grep -q 'onDroppedVideoFrames' "$P"
          grep -q 'surface.setFrameRate' "$P"
          grep -q 'surfaceViewRef = this.videoSurfaceView as? SurfaceView' "$P"
          grep -q 'versionCode 3311' AWPlayer_Polished_v480/app/build.gradle

      - name: Build release APK
        working-directory: AWPlayer_Polished_v480
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK=AWPlayer_Polished_v480/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          cp "$APK" AWPlayer-v4.8-Enhancer-Phase1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AWPlayer-v4.8-Enhancer-Phase1
          path: AWPlayer-v4.8-Enhancer-Phase1.apk
          if-no-files-found: error