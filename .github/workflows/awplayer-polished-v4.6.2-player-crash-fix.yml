      - name: Verify crash-fix source
        shell: bash
        run: |
          ! grep -R "setVideoEffects" AWPlayer_Polished_v462/app/src/main/java
          ! grep -q "media3-effect" AWPlayer_Polished_v462/app/build.gradle
          grep -q "AppCompatActivity" AWPlayer_Polished_v462/app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -q 'surface_type="texture_view"' AWPlayer_Polished_v462/app/src/main/res/layout/player_texture_view.xml

      - name: Build release APK
        working-directory: AWPlayer_Polished_v462
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK=AWPlayer_Polished_v462/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          if command -v apkanalyzer >/dev/null 2>&1; then
            apkanalyzer manifest application-id "$APK" | grep -qx 'com.awystudio.awplayer'
          fi
          cp "$APK" AWPlayer-v4.6.2-PlayerCrashFix.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AWPlayer-v4.6.2-PlayerCrashFix
          path: AWPlayer-v4.6.2-PlayerCrashFix.apk
          if-no-files-found: error
