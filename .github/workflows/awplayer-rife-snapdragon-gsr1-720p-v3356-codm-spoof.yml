      - name: Fetch pinned RIFE models
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          chmod +x scripts/prepare_rife.sh
          ./scripts/prepare_rife.sh

      - name: Verify v3356 CODM Game Space spoof + SGSR pipeline
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          SGSR=app/src/main/java/com/awystudio/awplayer/devclone/player/SgsrVideoView.kt
          JNI=app/src/main/cpp/rife_jni.cpp

          grep -q 'versionCode 3356' app/build.gradle
          grep -q "versionName '3.3.56-codm-gamespace-spoof'" app/build.gradle
          grep -q "applicationId 'com.activision.callofduty.shooter'" app/build.gradle
          grep -q 'android:appCategory="game"' app/src/main/AndroidManifest.xml
          grep -q 'android:label="AW Player"' app/src/main/AndroidManifest.xml
          test -f CURRENT_BUILD_v3356.md

          test -s app/src/main/assets/sgsr/sgsr1_shader_mobile.frag
          test -s app/src/main/assets/sgsr/sgsr1_shader_mobile_edge_direction.frag
          test -s app/src/main/assets/sgsr/LICENSE
          grep -q 'Qualcomm Innovation Center' app/src/main/assets/sgsr/sgsr1_shader_mobile.frag
          grep -q 'SPDX-License-Identifier: BSD-3-Clause' app/src/main/assets/sgsr/sgsr1_shader_mobile.frag
          grep -q 'textureGather' app/src/main/assets/sgsr/sgsr1_shader_mobile.frag
          grep -q 'UseEdgeDirection' app/src/main/assets/sgsr/sgsr1_shader_mobile_edge_direction.frag

          grep -q 'class SgsrVideoView' "$SGSR"
          grep -q 'GLES11Ext.GL_TEXTURE_EXTERNAL_OES' "$SGSR"
          grep -q 'SurfaceTexture(oesTexture)' "$SGSR"
          grep -q 'drawOes()' "$SGSR"
          grep -q 'drawSgsr()' "$SGSR"
          grep -q 'allocatedInputW = inW' "$SGSR"
          grep -q 'allocatedOutputH = outH' "$SGSR"
          grep -q 'Never reject an acquired SurfaceTexture frame based on timestamp alone' "$SGSR"
          grep -q 'newFrame = true' "$SGSR"

          grep -q 'val needs720pSpatialSr = sourceHeight in 1..719' "$SRC"
          grep -q 'SgsrVideoView(ctx)' "$SRC"
          grep -q 'Snapdragon GSR1' "$SRC"
          grep -q 'val geometry = smart720Geometry(sourceWidth, sourceHeight)' "$SRC"
          ! grep -q 'upscaleAheadPlayer' "$SRC"
          ! grep -q 'upscaleOverlayView' "$SRC"
          ! grep -q 'Evsr720pRealtimeEngine' "$SRC"
          ! grep -q 'DecoderYuvMailbox' "$SRC"
          ! grep -q 'tensorflow-lite' app/build.gradle
          ! test -f app/src/main/java/com/awystudio/awplayer/devclone/ai/Evsr720pEngine.kt
          ! test -f app/src/main/java/com/awystudio/awplayer/devclone/ai/DecoderYuvMailbox.kt

          python3 - <<'PYVERIFY'
          from pathlib import Path
          s=Path('app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt').read_text()
          g=Path('app/src/main/java/com/awystudio/awplayer/devclone/player/SgsrVideoView.kt').read_text()
          a=s.index('private fun smart720Geometry')
          b=s.index('private data class SmartEnhancerParams', a)
          geom=s[a:b]
          assert 'return Smart720Geometry(sourceW, sourceH, outputW, outputH)' in geom
          assert 'sourceW / 2' not in geom and 'sourceH / 2' not in geom
          assert 'android.widget.ImageView' not in g and 'ImageView(' not in g
          assert 'Bitmap' not in g
          assert 'TextureView.getBitmap' not in g
          assert 'player.pause()' not in g
          assert 'updateTexImage()' in g
          assert 'newFrame = true' in g
          assert 'nonMonotonicTimestamps++' in g
          print('SGSR single-plane / no-stale-frame invariants: OK')
          PYVERIFY

          test -f third_party/rife-ncnn-vulkan/src/rife.cpp
          test -f app/src/main/assets/rife-v4.6/flownet.bin
          grep -q 'g_rife->process(in0, in1, t, out)' "$JNI"
          bash -n scripts/prepare_rife.sh
          echo '=== v3356 CODM PACKAGE SPOOF + SNAPDRAGON GSR1 VERIFIED ==='

      - name: Build release APK
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          set +e
          set -o pipefail
          LOG="$RUNNER_TEMP/gradle-release.log"
          gradle :app:assembleRelease \
            --stacktrace --no-daemon --console=plain --warning-mode all \
            -PawVkInclude="$AW_VK_INCLUDE_DIR" \
            -PawVkLibrary="$AW_VK_LIBRARY" 2>&1 | tee "$LOG"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::group::Build failure summary"
            grep -nEi '(^e:|(^|[[:space:]])(error:|fatal error:|CMake Error|ninja: build stopped|FAILURE: Build failed|Execution failed for task|A problem occurred|undefined reference|cannot find|No such file|FAILED:))' "$LOG" | tail -n 260 || true
            echo "::endgroup::"
            echo "::group::Last 500 Gradle log lines"
            tail -n 500 "$LOG" || true
            echo "::endgroup::"
          fi
          exit "$code"

      - name: Upload full Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AWPlayer-v3356-gradle-build-log
          path: ${{ runner.temp }}/gradle-release.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify CODM-spoof APK
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libawplayer_rife.so'
          unzip -l "$APK" | grep -q 'assets/sgsr/sgsr1_shader_mobile.frag'
          unzip -l "$APK" | grep -q 'assets/sgsr/sgsr1_shader_mobile_edge_direction.frag'
          unzip -l "$APK" | grep -q 'assets/sgsr/LICENSE'
          unzip -l "$APK" | grep -q 'assets/rife-v4.6/flownet.bin'
          ! unzip -l "$APK" | grep -q 'evsrnet_x2.tflite'
          APPID=$(apkanalyzer manifest application-id "$APK")
          test "$APPID" = 'com.activision.callofduty.shooter'
          cp "$APK" ../AWPlayer-v4.9-CODM-GameSpace-Spoof-v3356.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AWPlayer-v4.9-CODM-GameSpace-Spoof-v3356
          path: AWPlayer-v4.9-CODM-GameSpace-Spoof-v3356.apk
          if-no-files-found: error
          retention-days: 14
