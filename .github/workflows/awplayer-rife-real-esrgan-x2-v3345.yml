      - name: Verify v3345 genuine x2 pipeline
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          AI=app/src/main/java/com/awystudio/awplayer/devclone/ai/RealEsrganNative.kt
          JNI=app/src/main/cpp/rife_jni.cpp
          CMAKE=app/src/main/cpp/CMakeLists.txt

          grep -q 'versionCode 3345' app/build.gradle
          grep -q "versionName '3.3.45-real-esrgan-x2'" app/build.gradle
          test -f CURRENT_BUILD_v3345.md

