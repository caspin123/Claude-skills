          object LorebookJsonCodec {
              data class ImportResult(val lorebook: Lorebook, val format: String)
          
              fun importAny(raw: String, fallbackFileName: String): ImportResult {
                  val text = raw.trim().removePrefix("\uFEFF").trim()
                  require(text.isNotBlank()) { "Empty JSON file" }
          
                  val fallbackName = cleanImportedName(fallbackFileName)
                  if (text.startsWith("[")) {
                      val array = JSONArray(text)
                      val entries = parseEntryArray(array, 8)
                      require(entries.isNotEmpty()) { "No lore entries found" }
                      return ImportResult(
                          Lorebook(name = fallbackName, description = "Imported from JanitorAI JSON", entries = entries),
                          "JanitorAI entry array"
                      )
                  }
          
                  require(text.startsWith("{")) { "File must contain a JSON array or object" }
                  val root = JSONObject(text)
          
                  root.optJSONObject("originalData")?.let { original ->
                      val defaultDepth = firstInt(original, "scan_depth", "scanDepth", "depth") ?: 8
                      val entries = entriesFromAny(original.opt("entries"), defaultDepth)
                      if (entries.isNotEmpty()) {
                          return ImportResult(
                              Lorebook(
                                  name = original.optString("name", fallbackName).ifBlank { fallbackName },
                                  description = original.optString("description", ""),
                                  entries = entries
                              ),
                              "JanitorAI/SillyTavern converted JSON"
                          )
                      }
                  }
          
                  val characterBook = root.optJSONObject("data")?.optJSONObject("character_book")
                      ?: root.optJSONObject("character_book")
                  if (characterBook != null) {
                      val defaultDepth = firstInt(characterBook, "scan_depth", "scanDepth", "depth") ?: 8
                      val entries = entriesFromAny(characterBook.opt("entries"), defaultDepth)
                      if (entries.isNotEmpty()) {
                          return ImportResult(
                              Lorebook(
                                  name = characterBook.optString("name", fallbackName).ifBlank { fallbackName },
                                  description = characterBook.optString("description", ""),
                                  entries = entries
                              ),
                              "Character Book JSON"
                          )
                      }
                  }
          
                  val defaultDepth = firstInt(root, "scan_depth", "scanDepth", "depth") ?: 8
                  val entries = entriesFromAny(root.opt("entries"), defaultDepth)
                  if (entries.isNotEmpty()) {
                      val format = when (root.opt("entries")) {
                          is JSONObject -> "SillyTavern-style lorebook"
                          is JSONArray -> "Object lorebook / JanitorAI"
                          else -> "Lorebook JSON"
                      }
                      return ImportResult(
                          Lorebook(
                              name = root.optString("name", fallbackName).ifBlank { fallbackName },
                              description = root.optString("description", ""),
                              enabled = !root.optBoolean("disabled", false),
                              entries = entries
                          ),
                          format
                      )
                  }
          
                  // Some Janitor exports wrap the raw array under a generic data/lorebook key.
                  val wrapped = root.optJSONArray("data") ?: root.optJSONArray("lorebook") ?: root.optJSONArray("world_info")
                  if (wrapped != null) {
                      val parsed = parseEntryArray(wrapped, defaultDepth)
                      if (parsed.isNotEmpty()) {
                          return ImportResult(
                              Lorebook(name = root.optString("name", fallbackName).ifBlank { fallbackName }, entries = parsed),
                              "Wrapped JanitorAI JSON"
                          )
                      }
                  }
          
                  throw IllegalArgumentException("No compatible lorebook entries were found")
              }
          
              fun exportJanitor(book: Lorebook): String {
                  val array = JSONArray()
                  book.entries.forEachIndexed { index, entry ->
                      array.put(JSONObject().apply {
                          put("name", entry.title)
                          put("key", JSONArray(splitKeys(entry.keys)))
                          put("keysecondary", JSONArray(splitKeys(entry.secondaryKeys)))
                          put("content", entry.content)
                          put("enabled", entry.enabled)
                          put("insertion_order", entry.priority)
                          put("case_sensitive", entry.caseSensitive)
                          put("priority", entry.priority)
                          put("id", index + 1)
                          put("comment", entry.title)
                          put("selective", entry.selective)
                          put("selectiveLogic", entry.selectiveLogic)
                          put("probability", entry.probability)
                          put("constant", entry.constant)
                          put("position", when (entry.position) {
                              "Before Character" -> "before_char"
                              "Before Chat" -> "before_chat"
                              else -> "after_char"
                          })
                          put("extensions", JSONObject().apply {
                              put("depth", entry.scanDepth)
                              put("probability", entry.probability)
                              put("useProbability", entry.probability < 100)
                              put("selectiveLogic", entry.selectiveLogic)
                              put("matchWholeWords", entry.wholeWord)
                              put("caseSensitive", entry.caseSensitive)
                          })
                      })
                  }
                  return array.toString(2)
              }
          
              fun safeFileName(name: String): String = name
                  .trim()
                  .ifBlank { "greyrp-lorebook" }
                  .replace(Regex("[^A-Za-z0-9._ -]+"), "_")
                  .replace(Regex("\\s+"), "-")
                  .take(80)
          
              private fun cleanImportedName(fileName: String): String {
                  val base = fileName.substringAfterLast('/').substringAfterLast(':')
                      .removeSuffix(".janitor.json").removeSuffix(".lorebook.json").removeSuffix(".json")
                      .trim()
                  return base.ifBlank { "Imported Lorebook" }
              }
          
              private fun entriesFromAny(value: Any?, defaultDepth: Int): List<LoreEntry> = when (value) {
                  is JSONArray -> parseEntryArray(value, defaultDepth)
                  is JSONObject -> {
                      val keys = value.keys().asSequence().toList().sortedWith(compareBy<String> { it.toIntOrNull() ?: Int.MAX_VALUE }.thenBy { it })
                      keys.mapNotNull { key -> value.optJSONObject(key)?.let { parseEntry(it, defaultDepth) } }
                  }
                  else -> emptyList()
              }
          
              private fun parseEntryArray(array: JSONArray, defaultDepth: Int): List<LoreEntry> {
                  val result = mutableListOf<LoreEntry>()
                  for (i in 0 until array.length()) {
                      val obj = array.optJSONObject(i) ?: continue
                      result += parseEntry(obj, defaultDepth)
                  }
                  return result
              }
          
              private fun parseEntry(j: JSONObject, defaultDepth: Int): LoreEntry {
                  val extensions = j.optJSONObject("extensions")
                  val primaryKeys = firstStringList(j, "key", "keys", "keywords")
                  val secondaryKeys = firstStringList(j, "keysecondary", "secondary_keys", "secondaryKeys")
                  val cleanPrimaryKeys = primaryKeys.map { it.trim() }.filter { it.isNotBlank() }.distinct()
                  val cleanSecondaryKeys = secondaryKeys.map { it.trim() }.filter { it.isNotBlank() }.distinct()
          
                  val title = firstNonBlankString(j, "name", "comment", "title", "memo") ?: "Lore Entry"
                  val enabled = when {
                      j.has("enabled") -> j.optBoolean("enabled", true)
                      j.has("disable") -> !j.optBoolean("disable", false)
                      else -> true
                  }
                  val priority = firstInt(j, "priority", "insertion_order", "insertionOrder", "order") ?: 50
                  val scanDepth = firstInt(j, "scan_depth", "scanDepth", "depth")
                      ?: extensions?.let { firstInt(it, "depth", "scanDepth", "scan_depth") }
                      ?: defaultDepth
                  val caseSensitive = firstBoolean(j, "case_sensitive", "caseSensitive")
                      ?: extensions?.let { firstBoolean(it, "caseSensitive", "case_sensitive") }
                      ?: false
                  val wholeWord = firstBoolean(j, "whole_word", "wholeWord", "matchWholeWords")
                      ?: extensions?.let { firstBoolean(it, "matchWholeWords", "wholeWord") }
                      ?: false
                  val selective = firstBoolean(j, "selective") ?: false
                  val selectiveLogic = (firstInt(j, "selectiveLogic", "selective_logic")
                      ?: extensions?.let { firstInt(it, "selectiveLogic", "selective_logic") }
                      ?: 0).coerceIn(0, 3)
                  val useProbability = firstBoolean(j, "useProbability")
                      ?: extensions?.let { firstBoolean(it, "useProbability") }
                      ?: true
                  val probabilityRaw = firstInt(j, "probability")
                      ?: extensions?.let { firstInt(it, "probability") }
                      ?: 100
                  val probability = if (useProbability) probabilityRaw.coerceIn(0, 100) else 100
          
                  return LoreEntry(
                      title = title,
                      keys = cleanPrimaryKeys.joinToString(", "),
                      secondaryKeys = cleanSecondaryKeys.joinToString(", "),
                      content = j.optString("content", j.optString("entry", "")),
                      enabled = enabled,
                      constant = j.optBoolean("constant", false),
                      selective = selective,
                      selectiveLogic = selectiveLogic,
                      probability = probability,
                      priority = priority.coerceIn(-999, 999),
                      scanDepth = scanDepth.coerceAtLeast(1),
                      caseSensitive = caseSensitive,
                      wholeWord = wholeWord,
                      position = mapPosition(j.opt("position"))
                  )
              }
          
              private fun mapPosition(value: Any?): String {
                  if (value is Number) {
                      return when (value.toInt()) {
                          0 -> "Before Character"
                          1 -> "After Character"
                          else -> "Before Chat"
                      }
                  }
                  val raw = value?.toString()?.trim()?.lowercase().orEmpty()
                  return when (raw) {
                      "before", "before_char", "before character", "before_character", "0" -> "Before Character"
                      "before_chat", "before chat", "at_depth", "atdepth", "2", "3", "4", "5", "6", "7" -> "Before Chat"
                      "after", "after_char", "after character", "after_character", "1" -> "After Character"
                      else -> "After Character"
                  }
              }
          
              private fun splitKeys(text: String): List<String> = text
                  .split(',', '\n')
                  .map { it.trim() }
                  .filter { it.isNotBlank() }
                  .distinct()
          
              private fun firstStringList(j: JSONObject, vararg keys: String): List<String> {
                  keys.forEach { key ->
                      if (!j.has(key)) return@forEach
                      val value = j.opt(key)
                      when (value) {
                          is JSONArray -> {
                              val out = mutableListOf<String>()
                              for (i in 0 until value.length()) value.optString(i).trim().takeIf { it.isNotBlank() }?.let(out::add)
                              if (out.isNotEmpty()) return out
                          }
                          is String -> {
                              val out = value.split(',', '\n').map { it.trim() }.filter { it.isNotBlank() }
                              if (out.isNotEmpty()) return out
                          }
                      }
                  }
                  return emptyList()
              }
          
              private fun firstNonBlankString(j: JSONObject, vararg keys: String): String? {
                  for (key in keys) {
                      val value = j.optString(key, "").trim()
                      if (value.isNotBlank()) return value
                  }
                  return null
              }
          
              private fun firstInt(j: JSONObject, vararg keys: String): Int? {
                  for (key in keys) {
                      if (!j.has(key)) continue
                      val value = j.opt(key)
                      val parsed = when (value) {
                          is Number -> value.toInt()
                          is String -> value.trim().toDoubleOrNull()?.toInt()
                          else -> null
                      }
                      if (parsed != null) return parsed
                  }
                  return null
              }
          
              private fun firstBoolean(j: JSONObject, vararg keys: String): Boolean? {
                  for (key in keys) {
                      if (!j.has(key)) continue
                      val value = j.opt(key)
                      return when (value) {
                          is Boolean -> value
                          is Number -> value.toInt() != 0
                          is String -> when (value.trim().lowercase()) {
                              "true", "1", "yes", "on" -> true
                              "false", "0", "no", "off" -> false
                              else -> null
                          }
                          else -> null
                      }
                  }
                  return null
              }
          }
          
          object LibraryStore {
              private const val PREF = "greyrp_library"
              private const val KEY = "library_v11"
          
              fun save(context: Context, rawState: LibraryState) {
                  val state = normalizeLibrary(rawState)
                  val root = JSONObject().apply {
                      put("activeCharacterId", state.activeCharacterId)
                      put("activePersonaId", state.activePersonaId)
                      put("activeLorebookIds", JSONArray(state.activeLorebookIds))
                      put("characters", JSONArray().apply { state.characters.forEach { put(characterToJson(it)) } })
                      put("personas", JSONArray().apply { state.personas.forEach { put(personaToJson(it)) } })
                      put("lorebooks", JSONArray().apply { state.lorebooks.forEach { put(lorebookToJson(it)) } })
                  }
                  context.getSharedPreferences(PREF, Context.MODE_PRIVATE).edit().putString(KEY, root.toString()).apply()
              }
          
              fun load(context: Context): LibraryState {
                  val raw = context.getSharedPreferences(PREF, Context.MODE_PRIVATE).getString(KEY, null)
                  if (raw.isNullOrBlank()) return migrateLegacy(context)
                  return try {
                      val root = JSONObject(raw)
                      val chars = mutableListOf<CharacterProfile>()
                      val personas = mutableListOf<UserPersonaProfile>()
                      val books = mutableListOf<Lorebook>()
                      root.optJSONArray("characters")?.let { arr -> for (i in 0 until arr.length()) chars += jsonToCharacter(arr.getJSONObject(i)) }
                      root.optJSONArray("personas")?.let { arr -> for (i in 0 until arr.length()) personas += jsonToPersona(arr.getJSONObject(i)) }
                      root.optJSONArray("lorebooks")?.let { arr -> for (i in 0 until arr.length()) books += jsonToLorebook(arr.getJSONObject(i)) }
                      val activeBooks = mutableListOf<String>()
                      root.optJSONArray("activeLorebookIds")?.let { arr -> for (i in 0 until arr.length()) activeBooks += arr.optString(i) }
                      normalizeLibrary(LibraryState(
                          characters = chars,
                          personas = personas,
                          lorebooks = books,
                          activeCharacterId = root.optString("activeCharacterId", ""),
                          activePersonaId = root.optString("activePersonaId", ""),
                          activeLorebookIds = activeBooks
                      ))
                  } catch (_: Exception) { migrateLegacy(context) }
              }
          
              private fun migrateLegacy(context: Context): LibraryState {
                  val raw = context.getSharedPreferences("greyrp_settings", Context.MODE_PRIVATE).getString("settings_json", null)
                  val legacy = try { if (raw.isNullOrBlank()) null else JSONObject(raw) } catch (_: Exception) { null }
                  val char = CharacterProfile(
                      name = legacy?.optString("characterName", "Character").orEmpty().ifBlank { "Character" },
                      description = legacy?.optString("characterPrompt", "").orEmpty(),
                      scenario = legacy?.optString("scenario", "").orEmpty(),
                      firstGreeting = legacy?.optString("firstMessage", "").orEmpty()
                  )
                  val personaText = legacy?.optString("userPersona", "").orEmpty()
                  val persona = UserPersonaProfile(description = personaText)
                  val state = normalizeLibrary(LibraryState(
                      characters = listOf(char), personas = listOf(persona),
                      activeCharacterId = char.id, activePersonaId = persona.id
                  ))
                  save(context, state)
                  return state
              }
          
              private fun characterToJson(c: CharacterProfile) = JSONObject().apply {
                  put("id", c.id); put("name", c.name); put("chatName", c.chatName); put("avatarUri", c.avatarUri)
                  put("description", c.description); put("scenario", c.scenario); put("firstGreeting", c.firstGreeting)
                  put("exampleDialogue", c.exampleDialogue); put("extraInstructions", c.extraInstructions)
              }
              private fun jsonToCharacter(j: JSONObject) = CharacterProfile(
                  id = j.optString("id", UUID.randomUUID().toString()), name = j.optString("name", "Character"),
                  chatName = j.optString("chatName", ""), avatarUri = j.optString("avatarUri", ""),
                  description = j.optString("description", ""), scenario = j.optString("scenario", ""),
                  firstGreeting = j.optString("firstGreeting", ""), exampleDialogue = j.optString("exampleDialogue", ""),
                  extraInstructions = j.optString("extraInstructions", "")
              )
              private fun personaToJson(p: UserPersonaProfile) = JSONObject().apply {
                  put("id", p.id); put("profileName", p.profileName); put("userName", p.userName); put("description", p.description)
              }
              private fun jsonToPersona(j: JSONObject) = UserPersonaProfile(
                  id = j.optString("id", UUID.randomUUID().toString()), profileName = j.optString("profileName", "Persona"),
                  userName = j.optString("userName", "User"), description = j.optString("description", "")
              )
              private fun lorebookToJson(b: Lorebook) = JSONObject().apply {
                  put("id", b.id); put("name", b.name); put("description", b.description); put("enabled", b.enabled)
                  put("entries", JSONArray().apply { b.entries.forEach { put(entryToJson(it)) } })
              }
              private fun jsonToLorebook(j: JSONObject): Lorebook {
                  val entries = mutableListOf<LoreEntry>()
                  j.optJSONArray("entries")?.let { arr -> for (i in 0 until arr.length()) entries += jsonToEntry(arr.getJSONObject(i)) }
                  return Lorebook(
                      id = j.optString("id", UUID.randomUUID().toString()), name = j.optString("name", "Lorebook"),
                      description = j.optString("description", ""), enabled = j.optBoolean("enabled", true), entries = entries
                  )
              }
              private fun entryToJson(e: LoreEntry) = JSONObject().apply {
                  put("id", e.id); put("title", e.title); put("keys", e.keys); put("secondaryKeys", e.secondaryKeys); put("content", e.content); put("enabled", e.enabled)
                  put("constant", e.constant); put("selective", e.selective); put("selectiveLogic", e.selectiveLogic); put("probability", e.probability)
                  put("priority", e.priority); put("scanDepth", e.scanDepth); put("caseSensitive", e.caseSensitive)
                  put("wholeWord", e.wholeWord); put("position", e.position)
              }
              private fun jsonToEntry(j: JSONObject) = LoreEntry(
                  id = j.optString("id", UUID.randomUUID().toString()), title = j.optString("title", "Lore Entry"),
                  keys = j.optString("keys", ""), secondaryKeys = j.optString("secondaryKeys", ""), content = j.optString("content", ""), enabled = j.optBoolean("enabled", true),
                  constant = j.optBoolean("constant", false), selective = j.optBoolean("selective", false), selectiveLogic = j.optInt("selectiveLogic", 0),
                  probability = j.optInt("probability", 100).coerceIn(0, 100), priority = j.optInt("priority", 50), scanDepth = j.optInt("scanDepth", 8),
                  caseSensitive = j.optBoolean("caseSensitive", false), wholeWord = j.optBoolean("wholeWord", false),
                  position = j.optString("position", "After Character")
              )
          }
          
          object CryptoStore {
              private const val KEYSTORE = "AndroidKeyStore"
              private const val ALIAS = "GreyRPApiKey"
              private const val PREF = "greyrp_crypto"
          
              fun put(context: Context, name: String, value: String) {
                  if (value.isBlank()) {
                      context.getSharedPreferences(PREF, Context.MODE_PRIVATE).edit().remove(name).apply()
                      return
                  }
                  try {
                      val cipher = Cipher.getInstance("AES/GCM/NoPadding")
                      cipher.init(Cipher.ENCRYPT_MODE, getOrCreateKey())
                      val encrypted = cipher.doFinal(value.toByteArray(Charsets.UTF_8))
                      val payload = Base64.encodeToString(cipher.iv, Base64.NO_WRAP) + ":" +
                          Base64.encodeToString(encrypted, Base64.NO_WRAP)
                      context.getSharedPreferences(PREF, Context.MODE_PRIVATE).edit().putString(name, payload).apply()
                  } catch (_: Exception) {
                      // If the keystore is unavailable, do not fall back to plaintext storage.
                  }
              }
          
              fun get(context: Context, name: String): String {
                  val payload = context.getSharedPreferences(PREF, Context.MODE_PRIVATE).getString(name, null)
                      ?: return ""
                  return try {
                      val parts = payload.split(":", limit = 2)
                      if (parts.size != 2) return ""
                      val iv = Base64.decode(parts[0], Base64.NO_WRAP)
                      val data = Base64.decode(parts[1], Base64.NO_WRAP)
                      val cipher = Cipher.getInstance("AES/GCM/NoPadding")
                      cipher.init(Cipher.DECRYPT_MODE, getOrCreateKey(), GCMParameterSpec(128, iv))
                      String(cipher.doFinal(data), Charsets.UTF_8)
                  } catch (_: Exception) {
                      ""
                  }
              }
          
              private fun getOrCreateKey(): SecretKey {
                  val ks = KeyStore.getInstance(KEYSTORE).apply { load(null) }
                  (ks.getKey(ALIAS, null) as? SecretKey)?.let { return it }
          
                  val generator = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, KEYSTORE)
                  generator.init(
                      KeyGenParameterSpec.Builder(
                          ALIAS,
                          KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT
                      )
                          .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                          .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                          .build()
                  )
                  return generator.generateKey()
              }
          }
          GREYRP_EOF

      - name: Create Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GreyRP-v1.2-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GreyRP-APK
          path: GreyRP-v1.2-debug.apk
          if-no-files-found: error
