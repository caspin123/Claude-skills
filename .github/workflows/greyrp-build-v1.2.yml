name: Build GreyRP Android APK v1.2

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - ".github/workflows/greyrp-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate GreyRP project
        shell: bash
        run: |
          mkdir -p "$(dirname 'settings.gradle.kts')"
          cat > 'settings.gradle.kts' <<'GREYRP_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GreyRP"
          include(":app")
          GREYRP_EOF
          
          mkdir -p "$(dirname 'build.gradle.kts')"
          cat > 'build.gradle.kts' <<'GREYRP_EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          GREYRP_EOF
          
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          cat > 'app/build.gradle.kts' <<'GREYRP_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          
          android {
              namespace = "com.greyrp.app"
              compileSdk = 35
          
              defaultConfig {
                  applicationId = "com.greyrp.app"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 3
                  versionName = "1.2.0"
              }
          
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }
          
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          
              kotlinOptions {
                  jvmTarget = "17"
              }
          
              buildFeatures {
                  compose = true
                  buildConfig = true
              }
          
              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }
          
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("com.google.mlkit:translate:17.0.3")
              implementation("com.google.mlkit:language-id:17.0.6")
              implementation("io.coil-kt:coil-compose:2.7.0")
          
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          GREYRP_EOF
          
          mkdir -p "$(dirname 'app/proguard-rules.pro')"
          cat > 'app/proguard-rules.pro' <<'GREYRP_EOF'
          # GreyRP currently keeps release builds unobfuscated for easier debugging.
          GREYRP_EOF
          
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'GREYRP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
          
              <application
                  android:allowBackup="true"
                  android:label="GreyRP"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.GreyRP"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          GREYRP_EOF
          
          mkdir -p "$(dirname 'app/src/main/res/values/styles.xml')"
          cat > 'app/src/main/res/values/styles.xml' <<'GREYRP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.GreyRP" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#0D0F11</item>
                  <item name="android:navigationBarColor">#0D0F11</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          GREYRP_EOF
          
          mkdir -p "$(dirname 'app/src/main/java/com/greyrp/app/MainActivity.kt')"
          cat > 'app/src/main/java/com/greyrp/app/MainActivity.kt' <<'GREYRP_EOF'
          package com.greyrp.app
          
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.security.keystore.KeyGenParameterSpec
          import android.security.keystore.KeyProperties
          import android.util.Base64
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.ExperimentalFoundationApi
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.clip
          import androidx.compose.foundation.combinedClickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.itemsIndexed
          import androidx.compose.foundation.lazy.rememberLazyListState
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.text.selection.SelectionContainer
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.runtime.snapshots.SnapshotStateList
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalClipboardManager
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.AnnotatedString
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.PasswordVisualTransformation
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import coil.compose.AsyncImage
          import com.google.mlkit.common.model.DownloadConditions
          import com.google.mlkit.nl.languageid.LanguageIdentification
          import com.google.mlkit.nl.translate.TranslateLanguage
          import com.google.mlkit.nl.translate.Translation
          import com.google.mlkit.nl.translate.TranslatorOptions
          import kotlinx.coroutines.launch
          import okhttp3.*
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.IOException
          import java.security.KeyStore
          import java.util.UUID
          import javax.crypto.Cipher
          import javax.crypto.KeyGenerator
          import javax.crypto.SecretKey
          import javax.crypto.spec.GCMParameterSpec
          
          data class ChatMessage(
              val id: String = UUID.randomUUID().toString(),
              val role: String,
              val content: String,
              val translated: String? = null
          )
          
          data class CharacterProfile(
              val id: String = UUID.randomUUID().toString(),
              val name: String = "Character",
              val chatName: String = "",
              val avatarUri: String = "",
              val description: String = "",
              val scenario: String = "",
              val firstGreeting: String = "",
              val exampleDialogue: String = "",
              val extraInstructions: String = ""
          )
          
          data class UserPersonaProfile(
              val id: String = UUID.randomUUID().toString(),
              val profileName: String = "Default Persona",
              val userName: String = "User",
              val description: String = ""
          )
          
          data class LoreEntry(
              val id: String = UUID.randomUUID().toString(),
              val title: String = "New Entry",
              val keys: String = "",
              val secondaryKeys: String = "",
              val content: String = "",
              val enabled: Boolean = true,
              val constant: Boolean = false,
              val selective: Boolean = false,
              val selectiveLogic: Int = 0,
              val probability: Int = 100,
              val priority: Int = 50,
              val scanDepth: Int = 8,
              val caseSensitive: Boolean = false,
              val wholeWord: Boolean = false,
              val position: String = "After Character"
          )
          
          data class Lorebook(
              val id: String = UUID.randomUUID().toString(),
              val name: String = "New Lorebook",
              val description: String = "",
              val enabled: Boolean = true,
              val entries: List<LoreEntry> = emptyList()
          )
          
          data class LibraryState(
              val characters: List<CharacterProfile> = listOf(CharacterProfile()),
              val personas: List<UserPersonaProfile> = listOf(UserPersonaProfile()),
              val lorebooks: List<Lorebook> = emptyList(),
              val activeCharacterId: String = "",
              val activePersonaId: String = "",
              val activeLorebookIds: List<String> = emptyList()
          ) {
              fun activeCharacter(): CharacterProfile =
                  characters.firstOrNull { it.id == activeCharacterId } ?: characters.firstOrNull() ?: CharacterProfile()
          
              fun activePersona(): UserPersonaProfile =
                  personas.firstOrNull { it.id == activePersonaId } ?: personas.firstOrNull() ?: UserPersonaProfile()
          }
          
          data class AppSettings(
              val provider: String = "OpenRouter",
              val customEndpoint: String = "",
              val model: String = "z-ai/glm-5.3-flash",
              val apiKey: String = "",
              val extraHeaders: String = "",
              val temperature: Float = 0.9f,
              val maxTokens: Int = 8192,
              val topP: Float = 0.95f,
              val includeTopK: Boolean = true,
              val topK: Int = 40,
              val includeMinP: Boolean = false,
              val minP: Float = 0.05f,
              val includeFrequencyPenalty: Boolean = false,
              val frequencyPenalty: Float = 0f,
              val includePresencePenalty: Boolean = false,
              val presencePenalty: Float = 0f,
              val includeRepetitionPenalty: Boolean = false,
              val repetitionPenalty: Float = 1f,
              val includeSeed: Boolean = false,
              val seed: Int = 1,
              val stopSequences: String = "",
              val stream: Boolean = true,
              val includeReasoning: Boolean = false,
              val reasoningEffort: String = "low",
              val reasoningMaxTokens: Int = 0,
              val excludeReasoning: Boolean = true,
              val translateReplies: Boolean = true,
              val translationWifiOnly: Boolean = false,
              val showOriginal: Boolean = true,
              val contextMode: String = "Full",
              val recentMessageCount: Int = 80,
              val systemPrompt: String = "Write immersive roleplay. Stay in character, maintain continuity, and avoid controlling the user's character.",
              val loreMaxEntries: Int = 0,
              val loreMaxChars: Int = 0
          )
          
          class MainActivity : ComponentActivity() {
              private lateinit var apiClient: RpApiClient
              private var activeCall: Call? = null
          
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  apiClient = RpApiClient()
          
                  setContent {
                      GreyTheme {
                          val settingsState = remember { mutableStateOf(SettingsStore.load(this)) }
                          val libraryState = remember { mutableStateOf(LibraryStore.load(this)) }
                          val messages = remember {
                              mutableStateListOf<ChatMessage>().apply {
                                  addAll(SettingsStore.loadMessages(this@MainActivity))
                              }
                          }
                          var sending by remember { mutableStateOf(false) }
                          var status by remember { mutableStateOf("جاهز") }
                          var screen by remember { mutableIntStateOf(0) }
          
                          val character = libraryState.value.activeCharacter()
                          val persona = libraryState.value.activePersona()
          
                          Surface(Modifier.fillMaxSize()) {
                              Scaffold(
                                  containerColor = GreyBg,
                                  bottomBar = {
                                      NavigationBar(containerColor = GreyPanel) {
                                          NavigationBarItem(
                                              selected = screen == 0,
                                              onClick = { screen = 0 },
                                              icon = { Text("●", fontSize = 15.sp) },
                                              label = { Text("المحادثة") }
                                          )
                                          NavigationBarItem(
                                              selected = screen == 1,
                                              onClick = { screen = 1 },
                                              icon = { Text("◆", fontSize = 15.sp) },
                                              label = { Text("Studio") }
                                          )
                                          NavigationBarItem(
                                              selected = screen == 2,
                                              onClick = { screen = 2 },
                                              icon = { Text("⚙", fontSize = 16.sp) },
                                              label = { Text("الإعدادات") }
                                          )
                                      }
                                  }
                              ) { padding ->
                                  when (screen) {
                                      0 -> ChatScreen(
                                          modifier = Modifier.padding(padding),
                                          settings = settingsState.value,
                                          character = character,
                                          persona = persona,
                                          messages = messages,
                                          sending = sending,
                                          status = status,
                                          onSend = { text ->
                                              if (text.isBlank() || sending) return@ChatScreen
                                              messages += ChatMessage(role = "user", content = text.trim())
                                              SettingsStore.saveMessages(this, messages)
                                              sending = true
                                              status = "جاري التوليد…"
                                              startGeneration(
                                                  settingsState.value,
                                                  libraryState.value,
                                                  messages,
                                                  onDelta = { delta ->
                                                      runOnUiThread {
                                                          val idx = messages.indexOfLast { it.role == "assistant" }
                                                          if (idx >= 0 && messages[idx].id == STREAM_ID) {
                                                              messages[idx] = messages[idx].copy(content = messages[idx].content + delta)
                                                          } else {
                                                              messages += ChatMessage(id = STREAM_ID, role = "assistant", content = delta)
                                                          }
                                                      }
                                                  },
                                                  onComplete = {
                                                      runOnUiThread {
                                                          val idx = messages.indexOfLast { it.id == STREAM_ID }
                                                          if (idx >= 0) {
                                                              val final = messages[idx].copy(id = UUID.randomUUID().toString())
                                                              messages[idx] = final
                                                              SettingsStore.saveMessages(this, messages)
                                                              if (settingsState.value.translateReplies && final.content.isNotBlank()) {
                                                                  status = "جاري الترجمة…"
                                                                  GoogleTranslator.translateToArabic(
                                                                      this,
                                                                      final.content,
                                                                      settingsState.value.translationWifiOnly,
                                                                      onSuccess = { ar ->
                                                                          runOnUiThread {
                                                                              val i = messages.indexOfFirst { it.id == final.id }
                                                                              if (i >= 0) {
                                                                                  messages[i] = messages[i].copy(translated = ar)
                                                                                  SettingsStore.saveMessages(this, messages)
                                                                              }
                                                                              sending = false
                                                                              status = "جاهز"
                                                                          }
                                                                      },
                                                                      onError = {
                                                                          runOnUiThread {
                                                                              sending = false
                                                                              status = "اكتمل الرد • تعذرت الترجمة"
                                                                          }
                                                                      }
                                                                  )
                                                              } else {
                                                                  sending = false
                                                                  status = "جاهز"
                                                              }
                                                          } else {
                                                              sending = false
                                                              status = "لم يصل نص"
                                                          }
                                                      }
                                                  },
                                                  onError = { error ->
                                                      runOnUiThread {
                                                          val idx = messages.indexOfLast { it.id == STREAM_ID }
                                                          if (idx >= 0 && messages[idx].content.isBlank()) messages.removeAt(idx)
                                                          sending = false
                                                          status = "خطأ: $error"
                                                      }
                                                  }
                                              )
                                          },
                                          onStop = {
                                              activeCall?.cancel()
                                              activeCall = null
                                              sending = false
                                              status = "تم الإيقاف"
                                              val idx = messages.indexOfLast { it.id == STREAM_ID }
                                              if (idx >= 0) {
                                                  messages[idx] = messages[idx].copy(id = UUID.randomUUID().toString())
                                                  SettingsStore.saveMessages(this, messages)
                                              }
                                          },
                                          onClear = {
                                              activeCall?.cancel()
                                              startFreshChat(libraryState.value, messages)
                                              status = "محادثة جديدة"
                                          },
                                          onRegenerate = {
                                              if (sending) return@ChatScreen
                                              val lastAssistant = messages.indexOfLast { it.role == "assistant" }
                                              if (lastAssistant >= 0) {
                                                  messages.removeAt(lastAssistant)
                                                  SettingsStore.saveMessages(this, messages)
                                                  sending = true
                                                  status = "إعادة التوليد…"
                                                  startGeneration(
                                                      settingsState.value,
                                                      libraryState.value,
                                                      messages,
                                                      onDelta = { delta ->
                                                          runOnUiThread {
                                                              val idx = messages.indexOfLast { it.id == STREAM_ID }
                                                              if (idx >= 0) messages[idx] = messages[idx].copy(content = messages[idx].content + delta)
                                                              else messages += ChatMessage(id = STREAM_ID, role = "assistant", content = delta)
                                                          }
                                                      },
                                                      onComplete = {
                                                          runOnUiThread {
                                                              val idx = messages.indexOfLast { it.id == STREAM_ID }
                                                              if (idx >= 0) {
                                                                  messages[idx] = messages[idx].copy(id = UUID.randomUUID().toString())
                                                                  SettingsStore.saveMessages(this, messages)
                                                              }
                                                              sending = false
                                                              status = "جاهز"
                                                          }
                                                      },
                                                      onError = { err ->
                                                          runOnUiThread {
                                                              sending = false
                                                              status = "خطأ: $err"
                                                          }
                                                      }
                                                  )
                                              }
                                          },
                                          onTranslate = { index ->
                                              if (index !in messages.indices) return@ChatScreen
                                              val m = messages[index]
                                              status = "جاري الترجمة…"
                                              GoogleTranslator.translateToArabic(
                                                  this,
                                                  m.content,
                                                  settingsState.value.translationWifiOnly,
                                                  onSuccess = { ar ->
                                                      runOnUiThread {
                                                          if (index in messages.indices && messages[index].id == m.id) {
                                                              messages[index] = m.copy(translated = ar)
                                                              SettingsStore.saveMessages(this, messages)
                                                          }
                                                          status = "جاهز"
                                                      }
                                                  },
                                                  onError = { err -> runOnUiThread { status = "تعذرت الترجمة: $err" } }
                                              )
                                          }
                                      )
          
                                      1 -> StudioScreen(
                                          modifier = Modifier.padding(padding),
                                          library = libraryState.value,
                                          onSaveLibrary = { updated ->
                                              libraryState.value = normalizeLibrary(updated)
                                              LibraryStore.save(this, libraryState.value)
                                              status = "تم الحفظ"
                                          },
                                          onUseCharacter = { charId ->
                                              val updated = normalizeLibrary(libraryState.value.copy(activeCharacterId = charId))
                                              libraryState.value = updated
                                              LibraryStore.save(this, updated)
                                              startFreshChat(updated, messages)
                                              screen = 0
                                              status = "تم تبديل الشخصية"
                                          },
                                          onUsePersona = { personaId ->
                                              val updated = normalizeLibrary(libraryState.value.copy(activePersonaId = personaId))
                                              libraryState.value = updated
                                              LibraryStore.save(this, updated)
                                              status = "تم تفعيل الـPersona"
                                          }
                                      )
          
                                      else -> SettingsScreen(
                                          modifier = Modifier.padding(padding),
                                          settings = settingsState.value,
                                          onSave = { updated ->
                                              settingsState.value = updated
                                              SettingsStore.save(this, updated)
                                              status = "تم حفظ الإعدادات"
                                          }
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          
              private fun startFreshChat(library: LibraryState, messages: SnapshotStateList<ChatMessage>) {
                  messages.clear()
                  val character = library.activeCharacter()
                  val persona = library.activePersona()
                  val greeting = applyMacros(character.firstGreeting, character, persona).trim()
                  if (greeting.isNotBlank()) messages += ChatMessage(role = "assistant", content = greeting)
                  SettingsStore.saveMessages(this, messages)
              }
          
              private fun startGeneration(
                  settings: AppSettings,
                  library: LibraryState,
                  messages: List<ChatMessage>,
                  onDelta: (String) -> Unit,
                  onComplete: () -> Unit,
                  onError: (String) -> Unit
              ) {
                  if (settings.apiKey.isBlank() && settings.provider == "OpenRouter") {
                      onError("أضف API Key أولاً من الإعدادات")
                      return
                  }
                  if (settings.model.isBlank()) {
                      onError("اسم الموديل فارغ")
                      return
                  }
                  val prepared = prepareContext(settings, library, messages)
                  activeCall = apiClient.chat(settings, prepared, onDelta, onComplete, onError)
              }
          
              private fun prepareContext(
                  settings: AppSettings,
                  library: LibraryState,
                  messages: List<ChatMessage>
              ): List<ChatMessage> {
                  val base = if (settings.contextMode == "Recent") {
                      messages.takeLast(settings.recentMessageCount.coerceAtLeast(2))
                  } else messages
          
                  val character = library.activeCharacter()
                  val persona = library.activePersona()
                  val lore = resolveLore(settings, library, base, character, persona)
          
                  val beforeCharacter = lore.filter { it.position == "Before Character" }
                  val afterCharacter = lore.filter { it.position == "After Character" }
                  val beforeChat = lore.filter { it.position == "Before Chat" }
          
                  fun loreBlock(entries: List<LoreEntry>): String = entries.joinToString("\n\n") { e ->
                      "[Lore: ${e.title}]\n${applyMacros(e.content, character, persona)}"
                  }
          
                  val systemText = buildString {
                      if (settings.systemPrompt.isNotBlank()) appendLine(applyMacros(settings.systemPrompt.trim(), character, persona))
                      if (beforeCharacter.isNotEmpty()) appendLine("\n${loreBlock(beforeCharacter)}")
                      appendLine("\nCharacter name: ${character.name.ifBlank { "Character" }}")
                      if (character.chatName.isNotBlank()) appendLine("Chat display name: ${character.chatName.trim()}")
                      if (character.description.isNotBlank()) appendLine("\nCharacter description:\n${applyMacros(character.description.trim(), character, persona)}")
                      if (character.extraInstructions.isNotBlank()) appendLine("\nCharacter instructions:\n${applyMacros(character.extraInstructions.trim(), character, persona)}")
                      if (afterCharacter.isNotEmpty()) appendLine("\n${loreBlock(afterCharacter)}")
                      if (character.scenario.isNotBlank()) appendLine("\nScenario:\n${applyMacros(character.scenario.trim(), character, persona)}")
                      if (persona.description.isNotBlank() || persona.userName.isNotBlank()) {
                          appendLine("\nUser persona (${persona.userName.ifBlank { "User" }}):\n${applyMacros(persona.description.trim(), character, persona)}")
                      }
                      if (character.exampleDialogue.isNotBlank()) appendLine("\nExample dialogue:\n${applyMacros(character.exampleDialogue.trim(), character, persona)}")
                      if (beforeChat.isNotEmpty()) appendLine("\n${loreBlock(beforeChat)}")
                      appendLine("\nMacro names: {{char}} = ${character.name.ifBlank { "Character" }}, {{user}} = ${persona.userName.ifBlank { "User" }}")
                  }.trim()
          
                  return buildList {
                      if (systemText.isNotBlank()) add(ChatMessage(role = "system", content = systemText))
                      addAll(base.filter { it.content.isNotBlank() })
                  }
              }
          
              companion object {
                  private const val STREAM_ID = "__streaming__"
              }
          }
          
          private val GreyBg = Color(0xFF0D0F11)
          private val GreyPanel = Color(0xFF15181B)
          private val GreyCard = Color(0xFF1B1F23)
          private val GreyCard2 = Color(0xFF22272C)
          private val Steel = Color(0xFFB7C2CC)
          private val SteelDim = Color(0xFF8D9AA5)
          private val OnDark = Color(0xFFE8ECEF)
          
          @Composable
          fun GreyTheme(content: @Composable () -> Unit) {
              val scheme = darkColorScheme(
                  primary = Steel,
                  onPrimary = Color(0xFF111315),
                  secondary = SteelDim,
                  background = GreyBg,
                  onBackground = OnDark,
                  surface = GreyPanel,
                  onSurface = OnDark,
                  surfaceVariant = GreyCard2,
                  outline = Color(0xFF48515A)
              )
              MaterialTheme(colorScheme = scheme, typography = Typography(), content = content)
          }
          
          @OptIn(ExperimentalFoundationApi::class)
          @Composable
          fun ChatScreen(
              modifier: Modifier,
              settings: AppSettings,
              character: CharacterProfile,
              persona: UserPersonaProfile,
              messages: SnapshotStateList<ChatMessage>,
              sending: Boolean,
              status: String,
              onSend: (String) -> Unit,
              onStop: () -> Unit,
              onClear: () -> Unit,
              onRegenerate: () -> Unit,
              onTranslate: (Int) -> Unit
          ) {
              var input by remember { mutableStateOf("") }
              val listState = rememberLazyListState()
              val scope = rememberCoroutineScope()
              val clipboard = LocalClipboardManager.current
              val displayName = character.chatName.ifBlank { character.name.ifBlank { "GreyRP" } }
              val userName = persona.userName.ifBlank { "YOU" }
          
              LaunchedEffect(messages.size, messages.lastOrNull()?.content?.length) {
                  if (messages.isNotEmpty()) listState.animateScrollToItem(messages.lastIndex)
              }
          
              Column(modifier.fillMaxSize().background(GreyBg)) {
                  Row(
                      Modifier.fillMaxWidth().background(GreyPanel).padding(horizontal = 12.dp, vertical = 9.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      if (character.avatarUri.isNotBlank()) {
                          AsyncImage(
                              model = character.avatarUri,
                              contentDescription = displayName,
                              contentScale = ContentScale.Crop,
                              modifier = Modifier.size(42.dp).clip(RoundedCornerShape(13.dp))
                          )
                          Spacer(Modifier.width(10.dp))
                      }
                      Column(Modifier.weight(1f)) {
                          Text(displayName, fontSize = 18.sp, fontWeight = FontWeight.SemiBold)
                          Text(
                              "${settings.model.ifBlank { "No model" }} • $status",
                              fontSize = 11.sp,
                              color = SteelDim,
                              maxLines = 1
                          )
                      }
                      TextButton(onClick = onRegenerate, enabled = !sending && messages.any { it.role == "assistant" }) { Text("Regen") }
                      TextButton(onClick = onClear) { Text("New") }
                  }
          
                  if (settings.contextMode == "Full") {
                      Surface(color = Color(0xFF121619), modifier = Modifier.fillMaxWidth()) {
                          Text(
                              "FULL CONTEXT • لا يوجد سقف 128K داخل GreyRP • حد الموديل/المزوّد فقط",
                              modifier = Modifier.padding(horizontal = 14.dp, vertical = 7.dp),
                              color = SteelDim,
                              fontSize = 10.sp
                          )
                      }
                  }
          
                  LazyColumn(
                      modifier = Modifier.weight(1f).fillMaxWidth(),
                      state = listState,
                      contentPadding = PaddingValues(12.dp),
                      verticalArrangement = Arrangement.spacedBy(10.dp)
                  ) {
                      if (messages.isEmpty()) item { EmptyChatCard(settings, character, persona) }
                      itemsIndexed(messages, key = { _, item -> item.id }) { index, msg ->
                          val isUser = msg.role == "user"
                          Row(Modifier.fillMaxWidth(), horizontalArrangement = if (isUser) Arrangement.End else Arrangement.Start) {
                              Surface(
                                  modifier = Modifier
                                      .fillMaxWidth(if (isUser) 0.86f else 0.96f)
                                      .combinedClickable(onClick = {}, onLongClick = { clipboard.setText(AnnotatedString(msg.content)) }),
                                  color = if (isUser) GreyCard2 else GreyCard,
                                  shape = RoundedCornerShape(18.dp)
                              ) {
                                  Column(Modifier.padding(14.dp)) {
                                      Row(verticalAlignment = Alignment.CenterVertically) {
                                          Text(
                                              if (isUser) userName.uppercase() else displayName.uppercase(),
                                              color = Steel,
                                              fontSize = 10.sp,
                                              fontWeight = FontWeight.Bold,
                                              modifier = Modifier.weight(1f)
                                          )
                                          if (!isUser && msg.id != "__streaming__") {
                                              TextButton(onClick = { onTranslate(index) }, contentPadding = PaddingValues(horizontal = 8.dp, vertical = 0.dp)) {
                                                  Text("AR", fontSize = 11.sp)
                                              }
                                          }
                                      }
                                      SelectionContainer {
                                          Column {
                                              if (settings.showOriginal || msg.translated == null) Text(msg.content, color = OnDark, lineHeight = 21.sp)
                                              msg.translated?.let { ar ->
                                                  if (settings.showOriginal) {
                                                      Spacer(Modifier.height(10.dp)); HorizontalDivider(color = Color(0xFF333A41)); Spacer(Modifier.height(10.dp))
                                                  }
                                                  Text(ar, color = Color(0xFFF1F3F4), lineHeight = 22.sp)
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
          
                  Column(Modifier.fillMaxWidth().background(GreyPanel).padding(10.dp)) {
                      OutlinedTextField(
                          value = input,
                          onValueChange = { input = it },
                          modifier = Modifier.fillMaxWidth(),
                          placeholder = { Text("اكتب ردك باسم $userName…") },
                          minLines = 1,
                          maxLines = 6,
                          shape = RoundedCornerShape(16.dp)
                      )
                      Spacer(Modifier.height(8.dp))
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Text(
                              "T ${"%.2f".format(settings.temperature)} • Max ${settings.maxTokens} • ${if (settings.stream) "Stream" else "Single"}",
                              modifier = Modifier.weight(1f), fontSize = 10.sp, color = SteelDim
                          )
                          if (sending) OutlinedButton(onClick = onStop) { Text("Stop") }
                          else Button(
                              onClick = {
                                  val text = input; input = ""; onSend(text)
                                  scope.launch { if (messages.isNotEmpty()) listState.animateScrollToItem(messages.lastIndex) }
                              },
                              enabled = input.isNotBlank()
                          ) { Text("Send") }
                      }
                  }
              }
          }
          
          @Composable
          private fun EmptyChatCard(settings: AppSettings, character: CharacterProfile, persona: UserPersonaProfile) {
              Surface(color = GreyCard, shape = RoundedCornerShape(22.dp), modifier = Modifier.fillMaxWidth()) {
                  Column(Modifier.padding(20.dp)) {
                      Text(character.chatName.ifBlank { character.name.ifBlank { "GreyRP" } }, fontSize = 27.sp, fontWeight = FontWeight.Bold, color = Steel)
                      Spacer(Modifier.height(7.dp))
                      Text("Persona: ${persona.profileName} • {{user}} = ${persona.userName.ifBlank { "User" }}", color = SteelDim, fontSize = 12.sp)
                      Spacer(Modifier.height(6.dp))
                      Text("{{char}} / {char} و {{user}} / {user} مدعومة في البطاقة والـLorebook.", color = SteelDim, fontSize = 11.sp)
                      Spacer(Modifier.height(10.dp))
                      Text("الموديل: ${settings.model}", color = SteelDim, fontSize = 12.sp)
                  }
              }
          }
          
          @Composable
          fun StudioScreen(
              modifier: Modifier,
              library: LibraryState,
              onSaveLibrary: (LibraryState) -> Unit,
              onUseCharacter: (String) -> Unit,
              onUsePersona: (String) -> Unit
          ) {
              var tab by remember { mutableStateOf("Character") }
              Column(modifier.fillMaxSize().background(GreyBg)) {
                  Column(Modifier.fillMaxWidth().background(GreyPanel).padding(12.dp)) {
                      SectionTitle("RP STUDIO", "Characters • Personas • Lorebooks")
                      Spacer(Modifier.height(8.dp))
                      SegmentedButtonRow(listOf("Character", "Persona", "Lorebook"), tab) { tab = it }
                  }
                  when (tab) {
                      "Character" -> CharacterLibraryEditor(Modifier.weight(1f), library, onSaveLibrary, onUseCharacter)
                      "Persona" -> PersonaLibraryEditor(Modifier.weight(1f), library, onSaveLibrary, onUsePersona)
                      else -> LorebookLibraryEditor(Modifier.weight(1f), library, onSaveLibrary)
                  }
              }
          }
          
          @Composable
          private fun CharacterLibraryEditor(
              modifier: Modifier,
              library: LibraryState,
              onSaveLibrary: (LibraryState) -> Unit,
              onUseCharacter: (String) -> Unit
          ) {
              val context = LocalContext.current
              var draft by remember(library.activeCharacterId, library.characters.size) { mutableStateOf(library.activeCharacter()) }
              val imagePicker = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
                  if (uri != null) {
                      try { context.contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION) } catch (_: Exception) {}
                      draft = draft.copy(avatarUri = uri.toString())
                  }
              }
          
              Column(modifier.verticalScroll(rememberScrollState()).padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  SectionTitle("CHARACTER LIBRARY", "اصنع أكثر من شخصية واختر النشطة للمحادثة")
                  library.characters.forEach { c ->
                      LibraryRow(
                          title = c.chatName.ifBlank { c.name },
                          subtitle = if (c.id == library.activeCharacterId) "ACTIVE • ${c.name}" else c.name,
                          selected = c.id == draft.id,
                          onEdit = { draft = c },
                          onUse = { onUseCharacter(c.id) },
                          onDelete = if (library.characters.size > 1) ({
                              val chars = library.characters.filterNot { it.id == c.id }
                              val active = if (library.activeCharacterId == c.id) chars.first().id else library.activeCharacterId
                              onSaveLibrary(library.copy(characters = chars, activeCharacterId = active))
                              if (draft.id == c.id) draft = chars.first()
                          }) else null
                      )
                  }
                  OutlinedButton(onClick = { draft = CharacterProfile(name = "") }, modifier = Modifier.fillMaxWidth()) { Text("+ NEW CHARACTER") }
                  HorizontalDivider()
          
                  if (draft.avatarUri.isNotBlank()) {
                      AsyncImage(
                          model = draft.avatarUri,
                          contentDescription = "Character avatar",
                          contentScale = ContentScale.Crop,
                          modifier = Modifier.size(110.dp).align(Alignment.CenterHorizontally).clip(RoundedCornerShape(24.dp))
                      )
                  }
                  Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                      OutlinedButton(onClick = { imagePicker.launch(arrayOf("image/*")) }, modifier = Modifier.weight(1f)) { Text("Choose Image") }
                      if (draft.avatarUri.isNotBlank()) OutlinedButton(onClick = { draft = draft.copy(avatarUri = "") }, modifier = Modifier.weight(1f)) { Text("Remove") }
                  }
                  GreyField("Character Name • {{char}}", draft.name, { draft = draft.copy(name = it) }, singleLine = true, hint = "مثال: Seraphine")
                  GreyField("Chat Name", draft.chatName, { draft = draft.copy(chatName = it) }, singleLine = true, hint = "الاسم الذي يظهر فوق الرسائل")
                  GreyField("Description / Personality", draft.description, { draft = draft.copy(description = it) }, minLines = 7)
                  GreyField("Scenario", draft.scenario, { draft = draft.copy(scenario = it) }, minLines = 5)
                  GreyField("First Greeting", draft.firstGreeting, { draft = draft.copy(firstGreeting = it) }, minLines = 6, hint = "يدعم {{char}} و {{user}}")
                  GreyField("Example Dialogue", draft.exampleDialogue, { draft = draft.copy(exampleDialogue = it) }, minLines = 7, hint = "{{char}}: ...\n{{user}}: ...")
                  GreyField("Extra Character Instructions", draft.extraInstructions, { draft = draft.copy(extraInstructions = it) }, minLines = 4)
                  MacroHelpCard()
          
                  Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                      OutlinedButton(
                          onClick = {
                              val clean = draft.copy(name = draft.name.ifBlank { "Character" })
                              val exists = library.characters.any { it.id == clean.id }
                              val chars = if (exists) library.characters.map { if (it.id == clean.id) clean else it } else library.characters + clean
                              val active = library.activeCharacterId.ifBlank { clean.id }
                              onSaveLibrary(library.copy(characters = chars, activeCharacterId = active))
                              draft = clean
                          },
                          modifier = Modifier.weight(1f)
                      ) { Text("SAVE") }
                      Button(
                          onClick = {
                              val clean = draft.copy(name = draft.name.ifBlank { "Character" })
                              val exists = library.characters.any { it.id == clean.id }
                              val chars = if (exists) library.characters.map { if (it.id == clean.id) clean else it } else library.characters + clean
                              onSaveLibrary(library.copy(characters = chars, activeCharacterId = clean.id))
                              onUseCharacter(clean.id)
                          },
                          modifier = Modifier.weight(1f)
                      ) { Text("USE + NEW CHAT") }
                  }
                  Spacer(Modifier.height(18.dp))
              }
          }
          
