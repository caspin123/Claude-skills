          private fun normalizeLibrary(input: LibraryState): LibraryState {
              val chars = if (input.characters.isEmpty()) listOf(CharacterProfile()) else input.characters
              val personas = if (input.personas.isEmpty()) listOf(UserPersonaProfile()) else input.personas
              val activeChar = input.activeCharacterId.takeIf { id -> chars.any { it.id == id } } ?: chars.first().id
              val activePersona = input.activePersonaId.takeIf { id -> personas.any { it.id == id } } ?: personas.first().id
              val validBookIds = input.activeLorebookIds.filter { id -> input.lorebooks.any { it.id == id } }.distinct()
              return input.copy(characters = chars, personas = personas, activeCharacterId = activeChar, activePersonaId = activePersona, activeLorebookIds = validBookIds)
          }
          
          private fun applyMacros(text: String, character: CharacterProfile, persona: UserPersonaProfile): String {
              if (text.isBlank()) return text
              val charName = character.name.ifBlank { "Character" }
              val userName = persona.userName.ifBlank { "User" }
              return text
                  .replace("{{char}}", charName, ignoreCase = true)
                  .replace("{char}", charName, ignoreCase = true)
                  .replace("{{user}}", userName, ignoreCase = true)
                  .replace("{user}", userName, ignoreCase = true)
          }
          
          private fun resolveLore(
              settings: AppSettings,
              library: LibraryState,
              messages: List<ChatMessage>,
              character: CharacterProfile,
              persona: UserPersonaProfile
          ): List<LoreEntry> {
              val activeBooks = library.lorebooks.filter { it.enabled && library.activeLorebookIds.contains(it.id) }
              val activated = mutableListOf<LoreEntry>()
          
              for (book in activeBooks) {
                  for (entry in book.entries) {
                      if (!entry.enabled || entry.content.isBlank()) continue
                      val triggered = entry.constant || matchesLoreEntry(entry, messages, character, persona)
                      val probabilityPassed = entry.probability >= 100 || (entry.probability > 0 && kotlin.random.Random.nextInt(100) < entry.probability)
                      if (triggered && probabilityPassed) activated += entry.copy(content = applyMacros(entry.content, character, persona))
                  }
              }
          
              var result = activated.sortedByDescending { it.priority }
              if (settings.loreMaxEntries > 0) result = result.take(settings.loreMaxEntries)
              if (settings.loreMaxChars > 0) {
                  var used = 0
                  result = result.mapNotNull { entry ->
                      if (used >= settings.loreMaxChars) null
                      else {
                          val remaining = settings.loreMaxChars - used
                          val clipped = if (entry.content.length > remaining) entry.content.take(remaining) else entry.content
                          used += clipped.length
                          if (clipped.isBlank()) null else entry.copy(content = clipped)
                      }
                  }
              }
              return result
          }
          
          private fun matchesLoreEntry(
              entry: LoreEntry,
              messages: List<ChatMessage>,
              character: CharacterProfile,
              persona: UserPersonaProfile
          ): Boolean {
              val primaryKeys = applyMacros(entry.keys, character, persona)
                  .split(',', '\n')
                  .map { it.trim() }
                  .filter { it.isNotBlank() }
              if (primaryKeys.isEmpty()) return false
          
              val haystack = messages.takeLast(entry.scanDepth.coerceAtLeast(1)).joinToString("\n") { it.content }
              if (haystack.isBlank()) return false
          
              fun keyMatches(key: String): Boolean {
                  if (key == "*") return true
                  if (!entry.wholeWord) return haystack.contains(key, ignoreCase = !entry.caseSensitive)
                  val flags = if (entry.caseSensitive) emptySet() else setOf(RegexOption.IGNORE_CASE)
                  val escaped = Regex.escape(key)
                  return Regex("(?<![\\p{L}\\p{N}_])$escaped(?![\\p{L}\\p{N}_])", flags).containsMatchIn(haystack)
              }
          
              val primaryMatched = primaryKeys.any(::keyMatches)
              if (!primaryMatched) return false
              if (!entry.selective) return true
          
              val secondary = applyMacros(entry.secondaryKeys, character, persona)
                  .split(',', '\n')
                  .map { it.trim() }
                  .filter { it.isNotBlank() }
              if (secondary.isEmpty()) return primaryMatched
              val matches = secondary.map(::keyMatches)
              return when (entry.selectiveLogic.coerceIn(0, 3)) {
                  0 -> matches.any()          // AND ANY
                  1 -> !matches.all()         // NOT ALL
                  2 -> matches.none()         // NOT ANY
                  3 -> matches.all()          // AND ALL
                  else -> matches.any()
              }
          }
          
          class RpApiClient {
              private val client = OkHttpClient.Builder().build()
          
              fun chat(
                  s: AppSettings,
                  messages: List<ChatMessage>,
                  onDelta: (String) -> Unit,
                  onComplete: () -> Unit,
                  onError: (String) -> Unit
              ): Call {
                  val url = if (s.provider == "OpenRouter") {
                      "https://openrouter.ai/api/v1/chat/completions"
                  } else {
                      s.customEndpoint.trim()
                  }
          
                  if (url.isBlank()) {
                      onError("Custom endpoint فارغ")
                      return client.newCall(Request.Builder().url("https://example.invalid").build())
                  }
          
                  val body = JSONObject().apply {
                      put("model", s.model)
                      put("stream", s.stream)
                      put("temperature", s.temperature.toDouble())
                      put("max_tokens", s.maxTokens)
                      put("top_p", s.topP.toDouble())
          
                      if (s.includeTopK) put("top_k", s.topK)
                      if (s.includeMinP) put("min_p", s.minP.toDouble())
                      if (s.includeFrequencyPenalty) put("frequency_penalty", s.frequencyPenalty.toDouble())
                      if (s.includePresencePenalty) put("presence_penalty", s.presencePenalty.toDouble())
                      if (s.includeRepetitionPenalty) put("repetition_penalty", s.repetitionPenalty.toDouble())
                      if (s.includeSeed) put("seed", s.seed)
          
                      val stops = s.stopSequences.lines().map { it.trim() }.filter { it.isNotBlank() }
                      if (stops.isNotEmpty()) put("stop", JSONArray(stops))
          
                      if (s.includeReasoning) {
                          put("reasoning", JSONObject().apply {
                              put("effort", s.reasoningEffort)
                              if (s.reasoningMaxTokens > 0) put("max_tokens", s.reasoningMaxTokens)
                              put("exclude", s.excludeReasoning)
                          })
                      }
          
                      put("messages", JSONArray().apply {
                          messages.forEach { m ->
                              put(JSONObject().apply {
                                  put("role", m.role)
                                  put("content", m.content)
                              })
                          }
                      })
                  }
          
                  val requestBody = body.toString().toRequestBody("application/json; charset=utf-8".toMediaType())
                  val builder = Request.Builder()
                      .url(url)
                      .post(requestBody)
                      .header("Content-Type", "application/json")
          
                  if (s.apiKey.isNotBlank()) builder.header("Authorization", "Bearer ${s.apiKey.trim()}")
                  if (s.provider == "OpenRouter") builder.header("X-Title", "GreyRP Android")
          
                  s.extraHeaders.lines().forEach { line ->
                      val idx = line.indexOf(':')
                      if (idx > 0) {
                          val key = line.substring(0, idx).trim()
                          val value = line.substring(idx + 1).trim()
                          if (key.isNotBlank() && value.isNotBlank() && !key.equals("Authorization", true)) {
                              builder.header(key, value)
                          }
                      }
                  }
          
                  val call = client.newCall(builder.build())
                  call.enqueue(object : Callback {
                      override fun onFailure(call: Call, e: IOException) {
                          if (call.isCanceled()) return
                          onError(e.message ?: "Network error")
                      }
          
                      override fun onResponse(call: Call, response: Response) {
                          response.use { res ->
                              if (!res.isSuccessful) {
                                  val text = res.body?.string().orEmpty()
                                  onError("HTTP ${res.code}: ${text.take(1200)}")
                                  return
                              }
          
                              val responseBody = res.body ?: run {
                                  onError("Empty response")
                                  return
                              }
          
                              if (!s.stream) {
                                  try {
                                      val root = JSONObject(responseBody.string())
                                      val choice = root.getJSONArray("choices").getJSONObject(0)
                                      val message = choice.getJSONObject("message")
                                      val content = readContent(message.opt("content"))
                                      if (content.isNotBlank()) onDelta(content)
                                      onComplete()
                                  } catch (e: Exception) {
                                      onError("Parse error: ${e.message}")
                                  }
                                  return
                              }
          
                              try {
                                  val source = responseBody.source()
                                  while (!source.exhausted()) {
                                      val line = source.readUtf8Line() ?: continue
                                      if (!line.startsWith("data:")) continue
                                      val data = line.removePrefix("data:").trim()
                                      if (data == "[DONE]") break
                                      if (data.isBlank()) continue
                                      val root = JSONObject(data)
                                      val choices = root.optJSONArray("choices") ?: continue
                                      if (choices.length() == 0) continue
                                      val delta = choices.getJSONObject(0).optJSONObject("delta") ?: continue
                                      val text = readContent(delta.opt("content"))
                                      if (text.isNotEmpty()) onDelta(text)
                                  }
                                  onComplete()
                              } catch (e: Exception) {
                                  if (!call.isCanceled()) onError("Stream error: ${e.message}")
                              }
                          }
                      }
                  })
                  return call
              }
          
              private fun readContent(value: Any?): String {
                  return when (value) {
                      is String -> value
                      is JSONArray -> buildString {
                          for (i in 0 until value.length()) {
                              val item = value.optJSONObject(i) ?: continue
                              if (item.optString("type") == "text") append(item.optString("text"))
                          }
                      }
                      else -> ""
                  }
              }
          }
          
          object GoogleTranslator {
              fun translateToArabic(
                  context: Context,
                  text: String,
                  wifiOnly: Boolean,
                  onSuccess: (String) -> Unit,
                  onError: (String) -> Unit
              ) {
                  if (text.isBlank()) {
                      onSuccess("")
                      return
                  }
          
                  val identifier = LanguageIdentification.getClient()
                  identifier.identifyLanguage(text)
                      .addOnSuccessListener { code ->
                          val srcTag = if (code == "und") "en" else code
                          if (srcTag == "ar") {
                              onSuccess(text)
                              identifier.close()
                              return@addOnSuccessListener
                          }
          
                          val sourceLanguage = TranslateLanguage.fromLanguageTag(srcTag) ?: TranslateLanguage.ENGLISH
                          val options = TranslatorOptions.Builder()
                              .setSourceLanguage(sourceLanguage)
                              .setTargetLanguage(TranslateLanguage.ARABIC)
                              .build()
                          val translator = Translation.getClient(options)
          
                          val conditionsBuilder = DownloadConditions.Builder()
                          if (wifiOnly) conditionsBuilder.requireWifi()
          
                          translator.downloadModelIfNeeded(conditionsBuilder.build())
                              .addOnSuccessListener {
                                  translator.translate(text)
                                      .addOnSuccessListener { translated ->
                                          onSuccess(translated)
                                          translator.close()
                                          identifier.close()
                                      }
                                      .addOnFailureListener { e ->
                                          onError(e.message ?: "Translation failed")
                                          translator.close()
                                          identifier.close()
                                      }
                              }
                              .addOnFailureListener { e ->
                                  onError(e.message ?: "Model download failed")
                                  translator.close()
                                  identifier.close()
                              }
                      }
                      .addOnFailureListener { e ->
                          identifier.close()
                          onError(e.message ?: "Language detection failed")
                      }
              }
          }
          
