                              val exists = library.personas.any { it.id == clean.id }
                              val items = if (exists) library.personas.map { if (it.id == clean.id) clean else it } else library.personas + clean
                              onSaveLibrary(library.copy(personas = items, activePersonaId = clean.id))
                              onUsePersona(clean.id)
                          },
                          modifier = Modifier.weight(1f)
                      ) { Text("SET ACTIVE") }
                  }
                  Spacer(Modifier.height(18.dp))
              }
          }
          
          @Composable
          private fun LorebookLibraryEditor(
              modifier: Modifier,
              library: LibraryState,
              onSaveLibrary: (LibraryState) -> Unit
          ) {
              val context = LocalContext.current
              var bookDraft by remember { mutableStateOf(library.lorebooks.firstOrNull() ?: Lorebook(name = "")) }
              var entryDraft by remember(bookDraft.id) { mutableStateOf(bookDraft.entries.firstOrNull() ?: LoreEntry(title = "")) }
              var ioMessage by remember { mutableStateOf("") }
          
              fun saveBook(book: Lorebook) {
                  val clean = book.copy(name = book.name.ifBlank { "Lorebook" })
                  val exists = library.lorebooks.any { it.id == clean.id }
                  val books = if (exists) library.lorebooks.map { if (it.id == clean.id) clean else it } else library.lorebooks + clean
                  onSaveLibrary(library.copy(lorebooks = books))
                  bookDraft = clean
              }
          
              val importLorebook = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
                  if (uri != null) {
                      try {
                          val raw = context.contentResolver.openInputStream(uri)?.bufferedReader(Charsets.UTF_8)?.use { it.readText() }
                              ?: error("Unable to read the selected file")
                          val imported = LorebookJsonCodec.importAny(raw, uri.lastPathSegment ?: "Imported Lorebook")
                          val books = library.lorebooks + imported.lorebook
                          onSaveLibrary(library.copy(
                              lorebooks = books,
                              activeLorebookIds = (library.activeLorebookIds + imported.lorebook.id).distinct()
                          ))
                          bookDraft = imported.lorebook
                          entryDraft = imported.lorebook.entries.firstOrNull() ?: LoreEntry(title = "")
                          ioMessage = "Imported ${imported.lorebook.entries.size} entries • ${imported.format}"
                      } catch (e: Exception) {
                          ioMessage = "Import failed: ${e.message ?: "Invalid JSON"}"
                      }
                  }
              }
          
              val exportJanitor = rememberLauncherForActivityResult(ActivityResultContracts.CreateDocument("application/json")) { uri ->
                  if (uri != null) {
                      try {
                          context.contentResolver.openOutputStream(uri)?.bufferedWriter(Charsets.UTF_8)?.use {
                              it.write(LorebookJsonCodec.exportJanitor(bookDraft))
                          } ?: error("Unable to create export file")
                          ioMessage = "Janitor-compatible JSON exported"
                      } catch (e: Exception) {
                          ioMessage = "Export failed: ${e.message ?: "Unknown error"}"
                      }
                  }
              }
          
              Column(modifier.verticalScroll(rememberScrollState()).padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  SectionTitle("LOREBOOK", "Janitor JSON import • keyword-triggered world info")
                  Surface(color = Color(0xFF121619), shape = RoundedCornerShape(14.dp), modifier = Modifier.fillMaxWidth()) {
                      Column(Modifier.padding(12.dp), verticalArrangement = Arrangement.spacedBy(9.dp)) {
                          Text("JANITORAI JSON", fontWeight = FontWeight.SemiBold)
                          Text(
                              "Import a JanitorAI lorebook directly. GreyRP auto-detects bare Janitor entry arrays, object-based lorebooks, SillyTavern-style entries, and character-book JSON.",
                              color = SteelDim, fontSize = 10.sp
                          )
                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              Button(
                                  onClick = { importLorebook.launch(arrayOf("application/json", "text/json", "text/plain")) },
                                  modifier = Modifier.weight(1f)
                              ) { Text("IMPORT JSON") }
                              OutlinedButton(
                                  onClick = {
                                      val name = LorebookJsonCodec.safeFileName(bookDraft.name.ifBlank { "greyrp-lorebook" })
                                      exportJanitor.launch("$name.janitor.json")
                                  },
                                  enabled = bookDraft.entries.isNotEmpty(),
                                  modifier = Modifier.weight(1f)
                              ) { Text("EXPORT JSON") }
                          }
                          if (ioMessage.isNotBlank()) Text(ioMessage, color = SteelDim, fontSize = 10.sp)
                      }
                  }
          
                  library.lorebooks.forEach { book ->
                      val active = library.activeLorebookIds.contains(book.id)
                      Surface(color = if (book.id == bookDraft.id) GreyCard2 else GreyCard, shape = RoundedCornerShape(14.dp), modifier = Modifier.fillMaxWidth()) {
                          Column(Modifier.padding(12.dp)) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Column(Modifier.weight(1f).clickable { bookDraft = book; entryDraft = book.entries.firstOrNull() ?: LoreEntry(title = "") }) {
                                      Text(book.name, fontWeight = FontWeight.SemiBold)
                                      Text("${book.entries.size} entries • ${if (active) "LINKED" else "Not linked"}", color = SteelDim, fontSize = 10.sp)
                                  }
                                  Switch(checked = active, onCheckedChange = { checked ->
                                      val ids = if (checked) (library.activeLorebookIds + book.id).distinct() else library.activeLorebookIds - book.id
                                      onSaveLibrary(library.copy(activeLorebookIds = ids))
                                  })
                              }
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  TextButton(onClick = { bookDraft = book; entryDraft = book.entries.firstOrNull() ?: LoreEntry(title = "") }) { Text("Edit") }
                                  TextButton(onClick = {
                                      val books = library.lorebooks.filterNot { it.id == book.id }
                                      onSaveLibrary(library.copy(lorebooks = books, activeLorebookIds = library.activeLorebookIds - book.id))
                                      if (bookDraft.id == book.id) {
                                          bookDraft = books.firstOrNull() ?: Lorebook(name = "")
                                          entryDraft = bookDraft.entries.firstOrNull() ?: LoreEntry(title = "")
                                      }
                                  }) { Text("Delete") }
                              }
                          }
                      }
                  }
                  OutlinedButton(
                      onClick = { bookDraft = Lorebook(name = ""); entryDraft = LoreEntry(title = "") },
                      modifier = Modifier.fillMaxWidth()
                  ) { Text("+ NEW LOREBOOK") }
          
                  HorizontalDivider()
                  GreyField("Lorebook Name", bookDraft.name, { bookDraft = bookDraft.copy(name = it) }, singleLine = true)
                  GreyField("Lorebook Description", bookDraft.description, { bookDraft = bookDraft.copy(description = it) }, minLines = 3)
                  SwitchRow("Lorebook enabled", "إذا مطفي ما يحقن أي Entry حتى لو Linked", bookDraft.enabled) { bookDraft = bookDraft.copy(enabled = it) }
                  Button(onClick = { saveBook(bookDraft) }, modifier = Modifier.fillMaxWidth()) { Text("SAVE LOREBOOK") }
          
                  HorizontalDivider()
                  SectionTitle("ENTRIES", "Keys → trigger → content injection")
                  bookDraft.entries.forEach { entry ->
                      Surface(color = if (entry.id == entryDraft.id) GreyCard2 else GreyCard, shape = RoundedCornerShape(12.dp), modifier = Modifier.fillMaxWidth().clickable { entryDraft = entry }) {
                          Row(Modifier.padding(11.dp), verticalAlignment = Alignment.CenterVertically) {
                              Column(Modifier.weight(1f)) {
                                  Text(entry.title.ifBlank { "Untitled Entry" })
                                  Text("P${entry.priority} • depth ${entry.scanDepth} • ${if (entry.constant) "Always" else entry.keys.take(60)}", color = SteelDim, fontSize = 10.sp, maxLines = 1)
                              }
                              if (!entry.enabled) Text("OFF", color = SteelDim, fontSize = 10.sp)
                          }
                      }
                  }
                  OutlinedButton(onClick = { entryDraft = LoreEntry(title = "") }, modifier = Modifier.fillMaxWidth()) { Text("+ NEW ENTRY") }
          
                  GreyField("Entry Title", entryDraft.title, { entryDraft = entryDraft.copy(title = it) }, singleLine = true)
                  GreyField("Keys / Keywords", entryDraft.keys, { entryDraft = entryDraft.copy(keys = it) }, minLines = 3, hint = "افصل بفاصلة أو سطر جديد: castle, king, القلعة")
                  GreyField("Secondary Keys", entryDraft.secondaryKeys, { entryDraft = entryDraft.copy(secondaryKeys = it) }, minLines = 2, hint = "Janitor selective keys / optional")
                  GreyField("Content", entryDraft.content, { entryDraft = entryDraft.copy(content = it) }, minLines = 8, hint = "يدعم {{char}} و {{user}}")
                  SwitchRow("Enabled", "تشغيل هذا الـEntry", entryDraft.enabled) { entryDraft = entryDraft.copy(enabled = it) }
                  SwitchRow("Constant / Always active", "يُحقن دائمًا بدون Keyword", entryDraft.constant) { entryDraft = entryDraft.copy(constant = it) }
                  SwitchRow("Selective keys", "طبّق منطق Janitor على Primary + Secondary keys", entryDraft.selective) { entryDraft = entryDraft.copy(selective = it) }
                  if (entryDraft.selective) {
                      Text("Selective logic", color = SteelDim, fontSize = 11.sp)
                      SegmentedButtonRow(
                          listOf("AND ANY", "NOT ALL", "NOT ANY", "AND ALL"),
                          listOf("AND ANY", "NOT ALL", "NOT ANY", "AND ALL").getOrElse(entryDraft.selectiveLogic) { "AND ANY" }
                      ) { choice ->
                          val idx = listOf("AND ANY", "NOT ALL", "NOT ANY", "AND ALL").indexOf(choice).coerceAtLeast(0)
                          entryDraft = entryDraft.copy(selectiveLogic = idx)
                      }
                  }
                  IntField("Probability %", entryDraft.probability) { entryDraft = entryDraft.copy(probability = it.coerceIn(0, 100)) }
