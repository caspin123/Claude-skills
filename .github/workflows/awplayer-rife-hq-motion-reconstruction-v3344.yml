      - name: Fetch RIFE Anime + ncnn
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          chmod +x scripts/prepare_rife.sh
          ./scripts/prepare_rife.sh

      - name: Verify current v3344 payload
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt

          # Current build identity
          grep -q 'versionCode 3344' app/build.gradle
          grep -q "versionName '3.3.44-upscaler-smart-pipeline'" app/build.gradle
          test -f CURRENT_BUILD_v3344.md

          # v3344 shader fix: AGSL reserves the identifier `input`. Both the
          # Anime Restore/Upscaler shader and the Quality/Balanced shader must
          # use a safe child shader name and bind the same name to RenderEffect.
          grep -q 'uniform shader sourceTex;' "$SRC"
          grep -q 'sourceTex.eval' "$SRC"
          grep -q 'createRuntimeShaderEffect(shader, "sourceTex")' "$SRC"
          ! grep -q 'uniform shader input;' "$SRC"
          ! grep -q 'input.eval' "$SRC"
          ! grep -q 'createRuntimeShaderEffect(shader, "input")' "$SRC"

          # Upscaler and Smart Quality/Balanced are one GPU pipeline now.
          grep -q 'smart = smartEnhance' "$SRC"
          grep -q 'setFloatUniform("uSuperRes", smart.superRes' "$SRC"
          grep -q 'setFloatUniform("uEdgeRecover", smart.edgeRecover' "$SRC"
          grep -q 'setFloatUniform("uSharpen", smart.sharpenBoost' "$SRC"
          grep -Fq '• $smartEnhancerMode' "$SRC"

          # Core RIFE payload inherited from the supplied baseline must still exist.
          test -f third_party/rife-ncnn-vulkan/src/rife.cpp
          test -f third_party/rife-ncnn-vulkan/src/warp.cpp
          test -f app/src/main/assets/rife-v4.6/flownet.param
          test -f app/src/main/assets/rife-v4.6/flownet.bin
          test -f app/src/main/assets/rife-anime/flownet.param
          test -f app/src/main/assets/rife-anime/flownet.bin
          grep -q 'Vulkan_LIBRARY' app/src/main/cpp/CMakeLists.txt
          grep -q 'NCNN_SIMPLEVK ON' app/src/main/cpp/CMakeLists.txt
          grep -q 'g_rife->process(in0, in1, t, out)' app/src/main/cpp/rife_jni.cpp

          echo '=== AW PLAYER v3344 UPSCALER + QUALITY/BALANCED PIPELINE VERIFIED ==='

      - name: Build release APK
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          gradle :app:assembleRelease --stacktrace --no-daemon \
            -PawVkInclude="$AW_VK_INCLUDE_DIR" \
            -PawVkLibrary="$AW_VK_LIBRARY"

      - name: Verify native RIFE APK
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libawplayer_rife.so"
          unzip -l "$APK" | grep -q "assets/rife-v4.6/flownet.bin"
          unzip -l "$APK" | grep -q "assets/rife-anime/flownet.bin"
          cp "$APK" ../AWPlayer-v4.9-Upscaler-Smart-v3344.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AWPlayer-v4.9-Upscaler-Smart-v3344
          path: AWPlayer-v4.9-Upscaler-Smart-v3344.apk
          if-no-files-found: error
          retention-days: 14
