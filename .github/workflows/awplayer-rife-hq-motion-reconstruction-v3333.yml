      - name: Fetch RIFE Anime + ncnn
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          chmod +x scripts/prepare_rife.sh
          ./scripts/prepare_rife.sh

      - name: Verify HQ motion reconstruction payload
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          test -f third_party/rife-ncnn-vulkan/src/rife.cpp
          test -f third_party/rife-ncnn-vulkan/src/warp.cpp
          test -f third_party/rife-ncnn-vulkan/src/ncnn/CMakeLists.txt
          test -f app/src/main/assets/rife-v4.6/flownet.param
          test -f app/src/main/assets/rife-v4.6/flownet.bin
          test -f app/src/main/assets/rife-anime/flownet.param
          test -f app/src/main/assets/rife-anime/flownet.bin
          grep -q 'Vulkan_LIBRARY' app/src/main/cpp/CMakeLists.txt
          grep -q 'NCNN_SIMPLEVK ON' app/src/main/cpp/CMakeLists.txt
          grep -q 'awVkInclude' app/build.gradle
          grep -q 'awVkLibrary' app/build.gradle
          grep -q 'versionCode 3333' app/build.gradle
          grep -q "versionName '3.3.33-rife-motion-reconstruction'" app/build.gradle
          test -f RIFE_HQ_MOTION_RECON_BUILD_3333.txt
          test -f FIX_NOTES_v3333.md
          grep -Fq 'v3333 HQ Motion-Reconstruction Presentation' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'pendingDuplicateSlots' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'totalTargetSteps = sourceIntervalsCovered * 2' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'rifeEngine.interpolate(prev, current, frameBitmap, t)' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'pairDurationMs !in minAdjacentMs..maxAdjacentMs' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'absolutePtsLooksValid' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'setDefaultBufferSize(wantedW, wantedH)' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'alpha = 1f' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          if grep -Fq 'videoTextureView?.alpha = 0f' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt; then
            echo 'ERROR: old low-resolution source hiding is still present'
            exit 1
          fi
          grep -Fq 'stableMediaPts' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'preferredDisplayModeId' app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          grep -Fq 'pair_is_scene_cut' app/src/main/cpp/rife_jni.cpp
          grep -Fq 'generated_output_is_suspicious' app/src/main/cpp/rife_jni.cpp
          grep -Fq 'build_local_motion_alpha' app/src/main/cpp/rife_jni.cpp
          grep -Fq 'packed_rgb_to_bitmap_background_locked' app/src/main/cpp/rife_jni.cpp
          grep -Fq 'write_linear_interpolated_to_bitmap' app/src/main/cpp/rife_jni.cpp
          grep -Fq 'g_rife->process(in0, in1, t, out)' app/src/main/cpp/rife_jni.cpp
          echo '=== RIFE HQ MOTION RECONSTRUCTION PAYLOAD v3333 VERIFIED ==='

      - name: Build release APK
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          gradle :app:assembleRelease --stacktrace --no-daemon \
            -PawVkInclude="$AW_VK_INCLUDE_DIR" \
            -PawVkLibrary="$AW_VK_LIBRARY"

      - name: Verify native RIFE APK
        working-directory: AWPlayer_Polished_v490
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libawplayer_rife.so"
          unzip -l "$APK" | grep -q "assets/rife-v4.6/flownet.bin"
          unzip -l "$APK" | grep -q "assets/rife-anime/flownet.bin"
          cp "$APK" ../AWPlayer-v4.9-RIFE-HQ-MotionRecon-v3333.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AWPlayer-v4.9-RIFE-HQ-MotionRecon-v3333
          path: AWPlayer-v4.9-RIFE-HQ-MotionRecon-v3333.apk
          if-no-files-found: error
          retention-days: 14
