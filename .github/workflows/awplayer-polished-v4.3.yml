      - name: Build release APK
        working-directory: AWPlayer_Polished_v43
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify package and Anime Witcher integration
        shell: bash
        run: |
          APK=AWPlayer_Polished_v43/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          if command -v apkanalyzer >/dev/null 2>&1; then
            apkanalyzer manifest application-id "$APK" | grep -qx 'com.awystudio.awplayer'
            apkanalyzer manifest print "$APK" > /tmp/manifest.txt
            grep -q 'anime_witcher' /tmp/manifest.txt
            grep -q 'com.awystudio.awplayer.activities.StreamVideoPlayerActivity' /tmp/manifest.txt
          else
            echo 'apkanalyzer not found; APK existence verified.'
          fi
          cp "$APK" AWPlayer-v4.3-AnimeWitcher.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AWPlayer-v4.3-AnimeWitcher
          path: AWPlayer-v4.3-AnimeWitcher.apk
          if-no-files-found: error
