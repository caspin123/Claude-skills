      - name: Verify cast variable ordering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('AWPlayer_Polished_v471/app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt')
          lines = p.read_text().splitlines()
          decl = next(i for i,l in enumerate(lines) if 'var castConnected by remember' in l)
          use = next(i for i,l in enumerate(lines) if 'val useGpuProcessing =' in l)
          assert decl < use, f'castConnected used before declaration: decl={decl}, use={use}'
          print('OK: castConnected is declared before useGpuProcessing')
          PY

      - name: Verify professional filter architecture
        shell: bash
        run: |
          grep -q 'surface_type="surface_view"' AWPlayer_Polished_v471/app/src/main/res/layout/player_surface_view.xml
          grep -q 'surface_type="texture_view"' AWPlayer_Polished_v471/app/src/main/res/layout/player_texture_view.xml
          grep -q 'RuntimeShader(PROFESSIONAL_FILTER_SHADER)' AWPlayer_Polished_v471/app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt
          ! grep -q 'setVideoEffects' AWPlayer_Polished_v471/app/src/main/java/com/awystudio/awplayer/devclone/player/PlayerActivity.kt

      - name: Build release APK
        working-directory: AWPlayer_Polished_v471
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK=AWPlayer_Polished_v471/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          if command -v apkanalyzer >/dev/null 2>&1; then
            apkanalyzer manifest application-id "$APK" | grep -qx 'com.awystudio.awplayer'
          fi
          cp "$APK" AWPlayer-v4.7.1-ProfessionalFilters-Fix.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AWPlayer-v4.7.1-ProfessionalFilters-Fix
          path: AWPlayer-v4.7.1-ProfessionalFilters-Fix.apk
          if-no-files-found: error
